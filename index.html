  const node   = ACTIVE.nodes[G.node];
  const choice = node.choices[i];
  PS = { choice };
  if      (choice.spell) openSpell(choice);
  else if (choice.dice)  openDice(choice);
  else                   go(choice.successNode);
}

// ── Spell overlay ──────────────────────────────────────────────
function openSpell(choice) {
  spellAttempts = 0;
  PS.choice = choice;
  const displayWord = choice.spell === 'NIHA0' ? 'NI HAO' : choice.spell;
  $('s-ctx').textContent  = choice.spellCtx || ('Spell the word:');
  $('s-word').textContent = displayWord;
  const v = VOCAB[choice.spell];
  $('s-def').textContent  = v ? v.def : '';
  $('s-tries').textContent  = '';
  $('s-hint').style.display = 'none';
  $('s-hint').textContent   = '';
  $('s-result').textContent = '';
  $('s-result').className   = 'spell-result';
  $('s-skip').style.display = 'none';
  $('s-input').value        = '';
  $('s-input').className    = 'spell-input';
  show($('spell-overlay'));
  setTimeout(() => $('s-input').focus(), 50);
}

function submitSpell() {
  const choice = PS.choice;
  const raw    = $('s-input').value.trim().toUpperCase().replace(/\s+/g, '');
  const target = (choice.spell === 'NIHA0' ? 'NIHAO' : choice.spell).toUpperCase().replace(/\s+/g, '');

  if (raw === target) {
    if (!G.wordsSpelled.includes(target)) G.wordsSpelled.push(target);
    G.score += 25; updateHUD();
    $('s-input').className    = 'spell-input correct';
    $('s-result').textContent = '✅ Correct! +25 points!';
    $('s-result').className   = 'spell-result show ok';
    setTimeout(() => {
      hide($('spell-overlay'));
      flash('✅ Correct! +25 pts', 'good');
      go(choice.successNode);
    }, 800);
  } else {
    spellAttempts++;
    $('s-input').className = 'spell-input wrong';
    setTimeout(() => { $('s-input').className = 'spell-input'; }, 500);

    if (spellAttempts >= 3) {
      $('s-result').textContent = '❌ Out of attempts!';
      $('s-result').className   = 'spell-result show bad';
      setTimeout(() => {
        hide($('spell-overlay'));
        flash('❌ ' + (choice.failText || 'Taking the harder path.'), 'bad');
        go(choice.failNode || choice.successNode);
      }, 900);
    } else {
      const left = 3 - spellAttempts;
      $('s-tries').textContent  = `✗ Not quite — ${left} attempt${left > 1 ? 's' : ''} left`;
      $('s-hint').style.display = '';
      $('s-hint').textContent   = 'Hint: starts with ' + target.slice(0, 2) + '…';
      $('s-input').value = '';
      $('s-input').focus();
      if (spellAttempts >= 2) $('s-skip').style.display = '';
    }
  }
}

function skipSpell() {
  const choice = PS.choice;
  hide($('spell-overlay'));
  flash(choice.failText || 'You took the harder path.', 'bad');
  go(choice.failNode || choice.successNode);
}

function toggleHint() {
  const h = $('s-hint');
  if (h.style.display === 'none' || !h.style.display) {
    const target = (PS.choice.spell === 'NIHA0' ? 'NIHAO' : PS.choice.spell).toUpperCase();
    h.textContent = 'Hint: starts with ' + target.slice(0, 2) + '…';
    h.style.display = '';
  } else {
    h.style.display = 'none';
  }
}

// ── Dice overlay ───────────────────────────────────────────────
function openDice(choice) {
  PS.choice = choice;
  $('dice-face').textContent = '🎲';
  $('dice-msg').textContent  = 'Tap to roll the dice!';
  $('dice-cont').textContent = 'ROLL THE DICE 🎲';
  $('dice-cont').onclick     = rollDice;
  show($('dice-overlay'));
}

function rollDice() {
  $('dice-cont').onclick = null;
  const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
  let spins = 0;
  const iv = setInterval(() => {
    $('dice-face').textContent = faces[Math.floor(Math.random() * 6)];
    if (++spins >= 14) {
      clearInterval(iv);
      const roll    = Math.floor(Math.random() * 6) + 1;
      $('dice-face').textContent = faces[roll - 1];
      const success = roll >= 4;
      const choice  = PS.choice;
      $('dice-msg').textContent  = `You rolled a ${roll}! ${success ? '🎉 SUCCESS!' : '💀 Bad luck…'}`;
      $('dice-cont').textContent = 'CONTINUE ➤';
      $('dice-cont').onclick = () => {
        hide($('dice-overlay'));
        if (success) {
          if (choice.diceGoodText) flash(choice.diceGoodText, 'good');
          go(choice.diceGoodNode || choice.successNode);
        } else {
          if (choice.diceBadText) flash(choice.diceBadText, 'bad');
          if (choice.diceBadHp) { G.hp = Math.max(0, G.hp + choice.diceBadHp); updateHUD(); }
          go(choice.diceBadNode || choice.failNode || choice.successNode);
        }
      };
    }
  }, 80);
}

// ── HUD ────────────────────────────────────────────────────────
function updateHUD() {
  const bar = $('hp-bar');
  bar.style.width      = G.hp + '%';
  bar.style.background = G.hp > 60 ? '#4caf50' : G.hp > 30 ? '#ffa726' : '#f44336';
  $('score-val').textContent = '⭐ ' + G.score;
}

// ── Flash message ──────────────────────────────────────────────
let _flashT;
function flash(msg, type) {
  const ft = $('flash-text');
  ft.textContent = msg;
  ft.className   = type === 'good' ? 'ok' : type === 'bad' ? 'bad' : '';
  show($('flash'));
  clearTimeout(_flashT);
  _flashT = setTimeout(() => hide($('flash')), 2500);
}

// ── Keyboard ───────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const so = $('spell-overlay');
  if (so.classList.contains('active')) {
    if (e.key === 'Enter')  { e.preventDefault(); submitSpell(); }
    if (e.key === 'Escape') skipSpell();
  }
});

// ── Wire up buttons ────────────────────────────────────────────
$('s-btn').onclick = submitSpell;

// ── Boot ───────────────────────────────────────────────────────
showPicker();

</script>
</body>
</html>
