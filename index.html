<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>READ · WRITE · SURVIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080f08;--panel:#0d1f0d;--panel2:#122412;--border:#1e4a1e;--accent:#4caf50;--amber:#ffa726;--text:#ddeedd;--subtext:#8ab08a;--gold:#ffd700;--sc:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh}
#header{position:sticky;top:0;z-index:100;background:rgba(8,15,8,.96);backdrop-filter:blur(12px);border-bottom:2px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#game-title{font-family:'Bangers',cursive;font-size:1.35rem;letter-spacing:3px;color:var(--gold);text-shadow:0 0 18px rgba(255,215,0,.5);flex-shrink:0}
.stat{display:flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700}
#hp-wrap{flex:1;min-width:80px;max-width:160px;height:11px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
#hp-bar{height:100%;border-radius:6px;transition:width .5s ease,background .5s}
#score-val{color:var(--gold)}
#back-btn{margin-left:auto;background:none;border:1px solid var(--border);color:var(--subtext);font-family:'Nunito',sans-serif;font-size:.8rem;padding:5px 10px;border-radius:8px;cursor:pointer;display:none}
#back-btn:hover{border-color:var(--gold);color:var(--gold)}
/* PICKER */
#picker{padding:24px 16px 60px;max-width:760px;margin:0 auto}
.picker-title{font-family:'Bangers',cursive;font-size:2.2rem;color:var(--gold);text-align:center;letter-spacing:3px;margin-bottom:6px;text-shadow:0 0 20px rgba(255,215,0,.4)}
.picker-sub{text-align:center;color:var(--subtext);margin-bottom:28px;font-size:.95rem}
.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.story-grid{grid-template-columns:1fr}}
.story-card{background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:5px}
.story-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sc-emoji{font-size:2rem}
.sc-title{font-family:'Bangers',cursive;font-size:1.25rem;letter-spacing:1px}
.sc-desc{font-size:.85rem;color:var(--subtext);line-height:1.5}
.sc-tag{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;opacity:.65;margin-top:2px}
/* GAME */
#main{max-width:680px;margin:0 auto;padding:22px 16px 80px;display:none}
.scene-card{background:var(--panel);border:2px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:slideIn .35s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.scene-header{background:linear-gradient(135deg,var(--panel2),#142814);padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.scene-emoji{font-size:2rem}
.scene-title-wrap{flex:1}
.scene-title{font-family:'Bangers',cursive;font-size:1.5rem;letter-spacing:2px;color:var(--gold);text-shadow:0 0 14px rgba(255,215,0,.4)}
.scene-chapter{font-size:.73rem;color:var(--subtext);text-transform:uppercase;letter-spacing:1px;margin-top:1px}
.scene-body{padding:20px;font-size:1.05rem;line-height:1.75}
.scene-body p{margin-bottom:12px}
.scene-body p:last-child{margin-bottom:0}
.highlight{color:var(--gold);font-weight:900}
.vocab-box{margin:16px 0;padding:14px 16px;background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.25);border-radius:10px;border-left:4px solid var(--gold)}
.vocab-word{font-family:'Bangers',cursive;font-size:1.2rem;color:var(--gold);letter-spacing:2px}
.vocab-def{font-size:.92rem;color:var(--subtext);margin-top:4px}
.vocab-ex{font-size:.86rem;color:rgba(255,215,0,.5);margin-top:3px;font-style:italic}
.item-gain{margin:12px 0;padding:12px 14px;background:rgba(76,175,80,.09);border:1px solid rgba(76,175,80,.25);border-radius:10px;border-left:4px solid #4caf50}
.item-gain-label{font-weight:900;color:#81c784;margin-bottom:5px;font-size:.88rem}
.item-gain-list{color:var(--subtext);font-size:.9rem}
.choices-wrap{padding:0 20px 20px}
.choices-label{font-size:.78rem;color:var(--subtext);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.choice-btn{width:100%;padding:13px 16px;margin-bottom:9px;border:none;border-radius:12px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.97rem;font-weight:700;text-align:left;transition:all .2s ease;display:flex;align-items:center;gap:10px}
.choice-btn:hover{transform:translateY(-2px)}
.choice-free{background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#c8e6c9;border:1px solid #388e3c}
.choice-free:hover{box-shadow:0 5px 18px rgba(76,175,80,.35)}
.choice-spell{background:linear-gradient(135deg,#bf360c,#e64a19);color:#fbe9e7;border:1px solid #ff5722}
.choice-spell:hover{box-shadow:0 5px 18px rgba(255,87,34,.35)}
.badge{margin-left:auto;flex-shrink:0;padding:2px 8px;border-radius:8px;font-size:.73rem;letter-spacing:.5px;background:rgba(255,255,255,.15)}
/* SPELL OVERLAY */
#spell-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
#spell-overlay.active{display:flex}
.spell-card{background:var(--panel);border:2px solid var(--amber);border-radius:20px;padding:28px;max-width:430px;width:100%;box-shadow:0 0 60px rgba(255,167,38,.2);animation:popIn .28s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.spell-head{font-family:'Bangers',cursive;font-size:1.3rem;color:var(--amber);letter-spacing:2px;margin-bottom:6px}
.spell-ctx{font-size:.88rem;color:var(--subtext);margin-bottom:10px}
.spell-target{font-family:'Bangers',cursive;font-size:2.6rem;color:var(--gold);letter-spacing:5px;text-align:center;margin:8px 0 4px;text-shadow:0 0 18px rgba(255,215,0,.45)}
.spell-def{text-align:center;color:var(--subtext);font-size:.88rem;margin-bottom:16px;font-style:italic}
.spell-input{width:100%;background:rgba(255,255,255,.06);border:2px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'Bangers',cursive;font-size:1.6rem;letter-spacing:4px;text-align:center;text-transform:uppercase;outline:none;transition:border-color .2s}
.spell-input:focus{border-color:var(--amber);box-shadow:0 0 18px rgba(255,167,38,.2)}
.spell-input.correct{border-color:#4caf50;background:rgba(76,175,80,.1);animation:correctPulse .45s ease}
.spell-input.wrong{border-color:#f44336;background:rgba(244,67,54,.1);animation:wrongShake .45s ease}
@keyframes correctPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.spell-tries{text-align:center;font-size:.8rem;color:var(--subtext);margin-top:6px}
.spell-hint-btn{background:none;border:none;color:var(--subtext);font-family:'Nunito',sans-serif;font-size:.82rem;cursor:pointer;text-decoration:underline;margin-top:6px;display:block;text-align:center;width:100%}
.spell-hint-box{display:none;text-align:center;color:var(--subtext);font-size:.86rem;margin-top:7px;padding:8px;background:rgba(255,255,255,.04);border-radius:8px}
.spell-result{display:none;text-align:center;padding:12px;border-radius:10px;margin-top:10px;font-weight:700;font-size:.93rem}
.spell-result.show{display:block}
.spell-result.ok{background:rgba(76,175,80,.14);color:#81c784;border:1px solid #4caf50}
.spell-result.bad{background:rgba(244,67,54,.14);color:#e57373;border:1px solid #f44336}
.spell-submit{width:100%;margin-top:14px;padding:13px;background:linear-gradient(135deg,#e65100,#ffa726);border:none;border-radius:10px;color:#fff;font-family:'Bangers',cursive;font-size:1.2rem;letter-spacing:2px;cursor:pointer;transition:all .2s}
.spell-submit:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(255,167,38,.4)}
.spell-skip{width:100%;margin-top:8px;padding:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--subtext);font-family:'Nunito',sans-serif;font-size:.86rem;cursor:pointer}
/* DICE */
#dice-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#dice-overlay.active{display:flex}
#dice-face{font-size:5.5rem;animation:diceRoll .9s ease}
@keyframes diceRoll{0%{transform:rotate(0deg) scale(.4);opacity:0}35%{transform:rotate(200deg) scale(1.2);opacity:1}65%{transform:rotate(320deg) scale(.9)}100%{transform:rotate(360deg) scale(1)}}
#dice-msg{font-family:'Bangers',cursive;font-size:1.45rem;color:var(--gold);letter-spacing:2px;text-align:center;max-width:320px;padding:0 20px}
#dice-cont{padding:12px 32px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-family:'Bangers',cursive;font-size:1.1rem;letter-spacing:2px;cursor:pointer}
#dice-cont:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(76,175,80,.4)}
/* FLASH */
#flash{display:none;position:fixed;inset:0;z-index:300;align-items:center;justify-content:center;pointer-events:none}
#flash.active{display:flex}
#flash-text{font-family:'Bangers',cursive;font-size:3.5rem;letter-spacing:4px;animation:flashAnim 1.1s ease forwards}
#flash-text.ok{color:#69f0ae;text-shadow:0 0 28px rgba(105,240,174,.8)}
#flash-text.bad{color:#ff5252;text-shadow:0 0 28px rgba(255,82,82,.8)}
@keyframes flashAnim{0%{opacity:0;transform:scale(.5)}30%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.85) translateY(-28px)}}
/* ENDING */
.ending-wrap{text-align:center;padding:36px 20px}
.ending-big-emoji{font-size:4rem;margin-bottom:14px}
.ending-title{font-family:'Bangers',cursive;font-size:2.3rem;letter-spacing:4px;margin-bottom:14px}
.ending-title.good{color:var(--gold);text-shadow:0 0 18px rgba(255,215,0,.5)}
.ending-title.bad{color:#f44336;text-shadow:0 0 18px rgba(244,67,54,.5)}
.ending-title.secret{color:#ce93d8;text-shadow:0 0 18px rgba(206,147,216,.5)}
.ending-body{font-size:1.05rem;line-height:1.8;max-width:500px;margin:0 auto 22px}
.ending-body p{margin-bottom:14px}
.final-score{font-family:'Bangers',cursive;font-size:2rem;color:var(--gold);margin-bottom:20px}
.words-panel{background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.25);border-radius:12px;padding:18px;margin:16px auto 24px;max-width:500px;text-align:left}
.words-panel h3{font-family:'Bangers',cursive;font-size:1.1rem;color:var(--gold);letter-spacing:2px;margin-bottom:12px;text-align:center}
.word-row{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);display:flex;gap:10px;font-size:.9rem;flex-wrap:wrap}
.word-row:last-child{border-bottom:none}
.wr-word{color:var(--gold);font-weight:900;min-width:130px;flex-shrink:0}
.wr-def{color:var(--subtext)}
.spelled-line{margin:0 auto 16px;max-width:500px;color:var(--subtext);font-size:.86rem}
.spelled-line strong{color:var(--gold)}
.restart-btn{padding:13px 32px;background:linear-gradient(135deg,#1b5e20,#388e3c);border:2px solid #4caf50;border-radius:12px;color:#fff;font-family:'Bangers',cursive;font-size:1.3rem;letter-spacing:2px;cursor:pointer;transition:all .2s;margin:6px}
.restart-btn:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(76,175,80,.4)}
.back-picker-btn{padding:13px 32px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:12px;color:var(--subtext);font-family:'Bangers',cursive;font-size:1.3rem;letter-spacing:2px;cursor:pointer;transition:all .2s;margin:6px}
.back-picker-btn:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:480px){.scene-title{font-size:1.2rem}.scene-body{font-size:.95rem}.spell-target{font-size:2rem}}
</style>
</head>
<body>
<div id="header">
  <div id="game-title">⚡ READ · WRITE · SURVIVE</div>
  <div class="stat">❤️ <div id="hp-wrap"><div id="hp-bar"></div></div></div>
  <div class="stat" id="score-val" style="display:none">⭐ 0</div>
  <button id="back-btn" onclick="showPicker()">◀ Stories</button>
</div>
<div id="picker"></div>
<div id="main"><div id="game-area"></div></div>
<div id="spell-overlay">
  <div class="spell-card">
    <div class="spell-head">🔤 SPELLING CHALLENGE!</div>
    <div class="spell-ctx" id="s-ctx"></div>
    <div class="spell-target" id="s-word"></div>
    <div class="spell-def" id="s-def"></div>
    <input class="spell-input" id="s-input" type="text" placeholder="TYPE IT HERE" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="spell-tries" id="s-tries"></div>
    <button class="spell-hint-btn" onclick="toggleHint()">💡 Need a hint?</button>
    <div class="spell-hint-box" id="s-hint"></div>
    <div class="spell-result" id="s-result"></div>
    <button class="spell-submit" id="s-btn">SUBMIT ➤</button>
    <button class="spell-skip" id="s-skip" style="display:none" onclick="skipSpell()">Take the other path instead →</button>
  </div>
</div>
<div id="dice-overlay">
  <div id="dice-face">🎲</div>
  <div id="dice-msg"></div>
  <button id="dice-cont">CONTINUE ➤</button>
</div>
<div id="flash"><div id="flash-text"></div></div>
<script>
// ═══ VOCAB (all stories) ═══
const VOCAB={
WRECKAGE:{def:'the twisted, broken remains left after a crash or disaster',ex:'Smoke rose from the wreckage of the plane.'},
SILHOUETTE:{def:'the dark outline of something seen against a bright background',ex:'She spotted the silhouette of a ship on the horizon.'},
THUNDEROUS:{def:'making an enormous deep sound like a crack of thunder',ex:'The thunderous roar shook the very ground.'},
CAUTIOUS:{def:'being very careful to avoid danger or mistakes',ex:'She was cautious — she checked every step before taking it.'},
PREDATOR:{def:'a creature that hunts and kills other animals to survive',ex:'The lion is Africa\'s most fearsome predator.'},
FOLIAGE:{def:'the leaves and branches of trees and plants in a forest',ex:'She hid behind the thick tropical foliage.'},
VENOMOUS:{def:'able to inject poison through a bite or sting — dangerously toxic',ex:'Never approach a venomous snake in the wild.'},
LUMINOUS:{def:'glowing with bright light, as if producing its own glow from within',ex:'The luminous mushrooms lit the cave walls in blue.'},
TREACHEROUS:{def:'extremely dangerous, full of hidden risks that are hard to spot',ex:'The treacherous cliff path crumbled at every step.'},
TURBULENT:{def:'full of sudden violent movement and disorder',ex:'The turbulent river smashed the raft against the rocks.'},
RESOURCEFUL:{def:'clever at finding creative solutions using whatever is available',ex:'He was so resourceful he built a shelter from bamboo and vine.'},
NAVIGATE:{def:'to plan and follow a route to get from one place to another',ex:'Using the stars, she could navigate across the ocean.'},
EXPEDITION:{def:'a journey made for a specific dangerous or exciting purpose',ex:'The expedition team discovered an uncharted jungle.'},
MAGNIFICENT:{def:'impressively beautiful and awe-inspiring — truly spectacular',ex:'The waterfall was the most magnificent thing he\'d ever seen.'},
FEROCIOUS:{def:'savagely fierce, violent and terrifyingly aggressive',ex:'The ferocious storm ripped trees from the ground.'},
// Egypt
HIEROGLYPHICS:{def:'the ancient Egyptian writing system using pictures and symbols instead of letters',ex:'The hieroglyphics on the tomb wall told the story of the pharaoh\'s life.'},
SARCOPHAGUS:{def:'a stone coffin, often decorated, used in ancient Egypt to hold a mummy',ex:'The golden sarcophagus gleamed in the torchlight.'},
PHARAOH:{def:'the title for the all-powerful ruler of ancient Egypt — like a king and a god combined',ex:'The pharaoh\'s tomb was filled with priceless treasures.'},
EXCAVATION:{def:'the careful process of digging to uncover buried objects or buildings',ex:'The excavation revealed a hidden chamber beneath the sand.'},
LABYRINTH:{def:'a complicated maze of passages that is very easy to get lost in',ex:'The labyrinth beneath the pyramid confused even the most experienced explorer.'},
SUBTERRANEAN:{def:'existing or happening underground, beneath the surface of the earth',ex:'The subterranean cave system stretched for miles.'},
INSCRIPTION:{def:'words carved or written onto stone, metal or wood — often ancient messages',ex:'The inscription on the wall warned of a terrible curse.'},
ARCHAEOLOGIST:{def:'a scientist who studies history by carefully digging up and examining ancient objects',ex:'The archaeologist brushed sand from the golden mask with a small brush.'},
ANTIQUITY:{def:'the ancient past — things from thousands of years ago',ex:'The vase was a priceless piece of antiquity, over 3000 years old.'},
SACRED:{def:'connected to a god or religion — treated with great respect and reverence',ex:'The sacred chamber was forbidden to all but the high priests.'},
PAPYRUS:{def:'a plant used in ancient Egypt to make an early form of paper for writing',ex:'The papyrus scroll contained the secrets of the pharaoh\'s tomb.'},
ILLUMINATED:{def:'lit up with light; also means decorated with gold and colours (like old manuscripts)',ex:'The illuminated manuscript was covered in tiny golden drawings.'},
// Europe
BONJOUR:{def:'The French word for "Hello" or "Good day" — pronounced "bon-ZHOOR"',ex:'BONJOUR! said the baker as you entered the Parisian shop.'},
MERCI:{def:'The French word for "Thank you" — pronounced "mair-SEE"',ex:'She handed you a croissant. You smiled and said: MERCI!'},
MAGNIFIQUE:{def:'The French word for "Magnificent" or "Wonderful" — pronounced "man-ee-FEEK"',ex:'C\'est magnifique! said the artist, pointing at the Eiffel Tower.'},
HOLA:{def:'The Spanish word for "Hello" — pronounced "OH-lah"',ex:'HOLA! called the shopkeeper from across the sunny plaza.'},
GRACIAS:{def:'The Spanish word for "Thank you" — pronounced "GRA-see-as"',ex:'She handed you a map. You said GRACIAS and she smiled.'},
CIAO:{def:'The Italian word for both "Hello" AND "Goodbye" — pronounced "CHOW"',ex:'CIAO! said the gondolier as he pushed off from the dock.'},
BELLISSIMO:{def:'The Italian word for "Most beautiful" or "Absolutely gorgeous" — pronounced "bel-EES-see-mo"',ex:'BELLISSIMO! the old artist cried, pointing at the Colosseum.'},
DANKE:{def:'The German word for "Thank you" — pronounced "DAHN-keh"',ex:'The friendly German gave you directions. You said DANKE!'},
WUNDERBAR:{def:'The German word for "Wonderful" or "Marvellous" — pronounced "VOON-der-bar"',ex:'WUNDERBAR! cried the tour guide as the castle came into view.'},
RENAISSANCE:{def:'a period of European history (1300s-1600s) when art, science and ideas exploded with new energy. The word means "rebirth" in French.',ex:'The Renaissance produced some of the most famous paintings in history.'},
CATHEDRAL:{def:'a very large, important church — usually the main church of a region, often with towers and stained glass',ex:'The cathedral took 200 years to build and its spire touched the clouds.'},
COBBLESTONE:{def:'small rounded stones fitted together to make old-fashioned roads and pathways',ex:'Her boots clicked on the cobblestone streets of the old city.'},
HERITAGE:{def:'the traditions, buildings and history passed down from previous generations',ex:'The ancient castle is part of our national heritage.'},
MONUMENT:{def:'a structure built to honour and remember a person or important event',ex:'The monument to the fallen soldiers stood in the centre of the square.'},
// Arctic
BLIZZARD:{def:'a severe snowstorm with very strong winds and very low visibility — you can\'t see more than a few metres',ex:'The blizzard hit without warning, turning the world white in minutes.'},
HYPOTHERMIA:{def:'a dangerous condition where the body loses heat faster than it can produce it — if untreated, it is fatal',ex:'Without shelter, hypothermia would set in within the hour.'},
FROSTBITE:{def:'an injury caused by extreme cold that freezes and damages skin and tissue',ex:'His fingers were numb — the first warning sign of frostbite.'},
AURORA:{def:'short for Aurora Borealis — the Northern Lights. Curtains of green, purple and pink light that dance across the Arctic sky.',ex:'The aurora appeared at midnight, lighting the ice in ghostly green.'},
GLACIER:{def:'a huge slow-moving river of ice, formed from compacted snow over thousands of years',ex:'The glacier groaned and cracked as its enormous weight shifted.'},
TUNDRA:{def:'the vast, flat, treeless landscape of the Arctic — frozen underground all year, with only small plants on the surface',ex:'The tundra stretched endlessly in every direction — flat, white and silent.'},
INSULATION:{def:'material that traps warm air and stops heat escaping — essential for surviving cold',ex:'The sleeping bag\'s insulation kept her warm even at minus thirty.'},
CRYSTALLINE:{def:'clear and sparkling like a crystal — often used to describe ice or frozen water',ex:'The crystalline ice caught the moonlight and scattered it like diamonds.'},
PERMAFROST:{def:'ground that remains frozen all year round, even in summer — found across the Arctic',ex:'Nothing can grow in permafrost — the soil is solid ice a metre down.'},
// Amazon
CANOPY:{def:'the uppermost layer of a forest formed by the tops of the tallest trees — like a green roof over everything below',ex:'Monkeys swung through the canopy, barely visible through the leaves.'},
TRIBUTARY:{def:'a smaller river or stream that flows into a larger one',ex:'They paddled up a narrow tributary, away from the main river.'},
INDIGENOUS:{def:'originally from and belonging to a particular place — describing people whose ancestors have lived somewhere for thousands of years',ex:'The indigenous people knew every plant in the forest and its use.'},
BIODIVERSITY:{def:'the huge variety of different plants, animals and living things in one place',ex:'The Amazon has the greatest biodiversity of any place on Earth.'},
PIRANHA:{def:'a small but ferocious freshwater fish with razor-sharp teeth — found in South American rivers',ex:'The piranha moved in a tight shoal, their teeth glinting under the water.'},
ANACONDA:{def:'the world\'s largest snake by weight — found in the Amazon, can grow to nine metres long',ex:'The anaconda lay coiled across the path like a fallen tree trunk.'},
PRECIPITATION:{def:'any form of water falling from the sky — rain, snow, hail or sleet',ex:'The precipitation in the Amazon amounts to metres of rain every year.'},
NOCTURNAL:{def:'active at night and sleeping during the day — the opposite of diurnal',ex:'The jaguar is nocturnal — it hunts in total darkness.'},
PHOTOSYNTHESIS:{def:'the process plants use to turn sunlight, water and air into food — the foundation of almost all life on Earth',ex:'The jungle canopy blocks sunlight, so only shade-adapted plants survive without photosynthesis help.'},
// Asia
KONNICHIWA:{def:'The Japanese word for "Hello" or "Good afternoon" — pronounced "kon-nee-chee-WAH"',ex:'KONNICHIWA! said the monk, bowing slightly as a greeting.'},
ARIGATO:{def:'The Japanese word for "Thank you" — pronounced "ah-ree-GAH-toh"',ex:'She handed you tea. You bowed your head and said: ARIGATO.'},
NIHA0:{def:'The Chinese (Mandarin) phrase for "Hello" — written 你好 and pronounced "nee HOW"',ex:'NI HAO! called the farmer from across the rice terrace.'},
XIEXIE:{def:'The Chinese (Mandarin) phrase for "Thank you" — written 谢谢 and pronounced "sheh-sheh"',ex:'The shopkeeper wrapped your gift. You said XIÈXIÈ and she smiled.'},
PAGODA:{def:'a tall tower with multiple levels and curved roofs, found in Asian countries — often a temple or shrine',ex:'The ancient pagoda rose above the mist like a stone ladder to the sky.'},
DYNASTY:{def:'a series of rulers from the same family who govern a country for many generations',ex:'The jade dragon was hidden during the Ming Dynasty, over 600 years ago.'},
BAMBOO:{def:'a giant grass with hollow woody stems — grows incredibly fast and is used for building, food and tools across Asia',ex:'The giant panda sat happily in a bamboo grove, eating nonstop.'},
MONSOON:{def:'the seasonal heavy rainfall that affects South and Southeast Asia — it brings both essential water and devastating floods',ex:'The monsoon arrived overnight and turned the dusty roads to rivers of mud.'},
TRANQUIL:{def:'calm, peaceful and undisturbed — a quality of serene stillness',ex:'The mountain shrine was tranquil — the only sound was wind through pine trees.'},
MEDITATION:{def:'the practice of focusing the mind completely in silence — used to achieve calm, clarity and inner peace',ex:'The monk had been in deep meditation for three hours without moving.'},
ANCESTOR:{def:'a person from whom you are descended — your grandparents, their grandparents, and everyone before them',ex:'The temple was built by his ancestors a thousand years ago.'},
// Africa
JAMBO:{def:'The Swahili word for "Hello" — pronounced "JAM-bo". Swahili is spoken across East Africa.',ex:'JAMBO! called the guide as the sun rose over the savanna.'},
ASANTE:{def:'The Swahili word for "Thank you" — pronounced "ah-SAHN-tay"',ex:'You reached the camp safely. ASANTE, you told your guide. He grinned.'},
SAFARI:{def:'The Swahili word for "journey" — this is where the English word "safari" comes from! Now used worldwide for wildlife trips.',ex:'The safari would take them across three countries following the great migration.'},
SIMBA:{def:'The Swahili word for "Lion" — pronounced "SIM-bah". You\'ve definitely heard this before!',ex:'A SIMBA — a lion — lay stretched across the track, completely unbothered.'},
TEMBO:{def:'The Swahili word for "Elephant" — pronounced "TEM-bo"',ex:'A family of TEMBO moved slowly to the waterhole, the baby between the adults.'},
SAVANNA:{def:'the vast open grassland of Africa, dotted with acacia trees — home to the great wildlife migration',ex:'The savanna turned gold in the evening light as the wildebeest moved through.'},
MIGRATION:{def:'the regular seasonal journey made by animals (or people) from one place to another',ex:'The Great Migration involves over a million wildebeest crossing the Serengeti.'},
MAJESTIC:{def:'having impressive beauty and dignity — inspiring awe and respect',ex:'The majestic elephant moved through the herd with slow, deliberate power.'},
CONSERVATION:{def:'the protection and careful management of the natural world and its wildlife',ex:'The rangers\' conservation work had helped the rhino population recover.'},
ECOSYSTEM:{def:'a community of living things — plants, animals, insects, fungi — all interacting with each other and their environment',ex:'Removing the lions would collapse the entire ecosystem of the savanna.'},
VULNERABLE:{def:'at risk of being hurt, damaged or destroyed — in wildlife, used for species in danger of extinction',ex:'The mountain gorilla is listed as vulnerable — there are fewer than 1000 left.'},
};

dinosaur:{id:'dinosaur',title:'Dinosaur Island',emoji:'🦕',color:'#4caf50',desc:'Survive a crash landing on an island full of living dinosaurs. Outrun, outwit, outlast.',tag:'Survival · Action',startNode:'start',
nodes:{
start:{chapter:'Chapter 1 · The Crash',title:'CRASH LANDING',emoji:'✈️',text:['The plane shudders violently. Through the cracked window you see an enormous jungle island rushing toward you at terrifying speed. The pilot\'s voice crackles and cuts out.','CRASH.','You open your eyes. Smoke curls from the twisted <span class="highlight">WRECKAGE</span> around you. A sandy beach glitters through the shattered window. From the dark jungle behind you: a deep, rhythmic breathing. Something enormous. Something that has smelled the smoke.','You have sixty seconds. Move.'],vocab:'WRECKAGE',hpChange:-10,choices:[{text:'🔍 Search the wreckage for supplies',spell:'WRECKAGE',spellCtx:'The twisted WRECKAGE might hold survival gear — spell it:',successNode:'wreckage_search',failNode:'beach_arrive',failText:'You hesitate and that breathing gets LOUDER — you bolt for the beach!'},{text:'🏃 Sprint straight to the beach',spell:null,dice:true,diceGoodNode:'beach_arrive',diceBadNode:'beach_stumble',diceGoodText:'You burst out just as the wreckage erupts in flame behind you!',diceBadText:'You trip and land face-first in the sand.',diceBadHp:-5,successNode:'beach_arrive'}]},
wreckage_search:{chapter:'Chapter 1 · The Crash',title:'SUPPLIES FOUND!',emoji:'🎒',text:['Careful of the jagged edges, you rummage through the smoke-filled cabin. Score.','You find: a penknife 🔪, waterproof matches 🔥, a protein bar 🍫, a water bottle 💧, and a torn map of the island 🗺️.','The breathing outside is louder now. Time to go.'],itemsGain:['Penknife 🔪','Matches 🔥','Protein Bar 🍫','Water Bottle 💧','Island Map 🗺️'],scoreChange:20,choices:[{text:'🏃 Get to the beach — NOW',spell:null,successNode:'beach_arrive'}]},
beach_stumble:{chapter:'Chapter 1 · The Crash',title:'FACE FULL OF SAND',emoji:'😬',text:['You spit out sand and scramble upright. The plane groans behind you. Something very large is crashing toward it through the trees.','You\'re on the beach. Alive. Covered in sand. That\'s good enough.'],hpChange:-5,choices:[{text:'👀 Get your bearings',spell:null,successNode:'beach_arrive'}]},
beach_arrive:{chapter:'Chapter 1 · The Crash',title:'THE BEACH',emoji:'🏖️',text:['You burst onto a wide white beach. The ocean pounds the shore in long rolling waves.','Far out to sea: a dark <span class="highlight">SILHOUETTE</span> against the horizon. A boat? A ship? Hard to tell from here.','Behind you, the trees shake. The ground trembles. Something very large is coming.'],vocab:'SILHOUETTE',choices:[{text:'🚢 Signal the boat on the horizon',spell:'SILHOUETTE',spellCtx:'Identify that SILHOUETTE on the water — spell it to focus your signal:',successNode:'signal_good',failNode:'signal_weak',failText:'You wave randomly — the boat might have seen you. Might not.'},{text:'🪨 Hide in the rocks along the cliff',spell:null,successNode:'cliff_rocks'},{text:'🌴 Sprint for the palm trees',spell:null,dice:true,diceGoodNode:'palm_point',diceBadNode:'trex_sees_you',diceGoodText:'You slip between the palms just in time!',diceBadText:'A massive shadow falls over you from behind...',diceBadHp:-15,successNode:'palm_point'}]},
signal_good:{chapter:'Chapter 2 · Rescue or Run?',title:'THEY MIGHT SEE YOU!',emoji:'🚢',text:['You sprint to the waterline, waving your jacket and screaming until your throat burns. The silhouette on the water slows. Someone has seen you.','Then the ground begins to shake. A <span class="highlight">THUNDEROUS</span> impact — getting faster. Getting closer.','The shadow sweeps over the beach. Something massive emerges from the treeline.','The boat is a kilometre out. You need to survive until it reaches you.'],vocab:'THUNDEROUS',scoreChange:15,choices:[{text:'🪨 Hide in the sea rocks and wait',spell:'CAUTIOUS',spellCtx:'Stay CAUTIOUS — perfectly still. Spell it:',successNode:'wait_in_rocks',failNode:'trex_chase_beach',failText:'You panic and move at the wrong moment — it spots you!'},{text:'💨 Run along the beach toward the boat',spell:null,dice:true,diceGoodNode:'outrun_it',diceBadNode:'trex_chase_beach',diceGoodText:'Your legs find a speed you didn\'t know you had!',diceBadText:'Your foot sinks in soft sand — you stumble!',diceBadHp:-20,successNode:'outrun_it'}]},
signal_weak:{chapter:'Chapter 2 · Rescue or Run?',title:'DID THEY SEE?',emoji:'🤔',text:['You wave and shout as hard as you can. The shape on the water doesn\'t change course.','Behind you, the jungle crashes. Something very large is moving.','You need another plan.'],hpChange:-5,choices:[{text:'🪨 Get to the cliff rocks',spell:null,successNode:'cliff_rocks'},{text:'🌿 Disappear into the jungle',spell:null,successNode:'jungle_edge'}]},
outrun_it:{chapter:'Chapter 2 · Rescue or Run?',title:'FASTEST IN THE WORLD',emoji:'💨',text:['Your lungs burn. Sand flies from your heels. The roaring is so loud it shakes your vision.','But you are FAST. Faster than you\'ve ever been.','The rescue boat drops a dinghy. Two crew in orange reach out. You splash into the shallows, they grab you, haul you in.','You look back. The T-Rex stands at the waterline. It does not follow.'],hpChange:10,scoreChange:40,choices:[{text:'🚢 Get aboard the ship',spell:null,successNode:'end_boat'}]},
wait_in_rocks:{chapter:'Chapter 2 · Rescue or Run?',title:'PERFECTLY STILL',emoji:'🪨',text:['You wedge into a gap between two boulders and press flat. You slow your breathing. You do not move. Not even a finger.','The T-Rex passes so close you could touch its scales. Its eye — the size of a dinner plate — scans the beach.','It snorts. Hot wet breath washes over the rocks. Then, slowly, it turns and leaves.','You wait three more minutes. Just to be sure.'],hpChange:5,scoreChange:25,choices:[{text:'🚢 Signal the approaching boat',spell:null,successNode:'boat_arrives'},{text:'🌿 Slip into the jungle',spell:null,successNode:'jungle_edge'}]},
boat_arrives:{chapter:'Chapter 2 · Rescue or Run?',title:'THE CREW SPOTS YOU',emoji:'🚤',text:['The boat drops anchor offshore. A crew member waves. They\'re too far to wade to — the dinghy will take a few minutes.','Those could be very eventful minutes on an island like this.'],choices:[{text:'⏳ Stay hidden and wait',spell:'PERILOUS',spellCtx:'The situation is PERILOUS — dangerous at every moment. Spell it to stay focused:',successNode:'boat_rescue',failNode:'boat_rescue',failText:'You fumble the word but stay hidden anyway — it works out!'},{text:'🌊 Wade out to meet the dinghy',spell:null,dice:true,diceGoodNode:'boat_rescue',diceBadNode:'boat_rescue',diceGoodText:'The dinghy crew see you and speed toward you!',diceBadText:'You step in a hidden channel and go under — crew hauls you up.',diceBadHp:-5,successNode:'boat_rescue'}]},
boat_rescue:{chapter:'Chapter 2 · Rescue or Run?',title:'ABOARD!',emoji:'🚢',text:['The crew wrap you in a blanket smelling magnificently of fish. Hot soup. Best thing ever tasted.','You try to explain about the T-Rex. Nobody looks convinced.','Let\'s get you home," says the captain.'],scoreChange:50,choices:[{text:'🏠 Head home',spell:null,successNode:'end_boat'}]},
trex_chase_beach:{chapter:'Chapter 2 · Rescue or Run?',title:'RUN FOR YOUR LIFE!',emoji:'🦖',text:['The T-Rex is forty feet of muscle and teeth. You run. It chases. Sand flies everywhere.','You dive sideways as its jaws snap shut where your head was a second ago. You scramble up and bolt for the treeline.'],hpChange:-20,choices:[{text:'🌿 Into the jungle — GO!',spell:null,successNode:'jungle_edge'}]},
trex_sees_you:{chapter:'Chapter 2 · Rescue or Run?',title:'OH NO.',emoji:'🦖',text:['A shadow covers you. You look up past the massive legs, past the belly, past the tiny useless arms, into two small blinking eyes.','The T-Rex tilts its head. It makes a sound you\'ll hear in nightmares for years.','"Hi," you say. This does not help.'],hpChange:-20,choices:[{text:'🌿 Use the FOLIAGE to hide',spell:'FOLIAGE',spellCtx:'Grab dense FOLIAGE — leaves and branches — to cover yourself. Spell it:',successNode:'foliage_hide_success',failNode:'trex_chase_jungle',failText:'You drop the leaves in panic and run into the jungle!'},{text:'🌴 Climb the nearest palm tree',spell:null,dice:true,diceGoodNode:'up_the_tree',diceBadNode:'trex_chase_jungle',diceGoodText:'You shinny up before it can react!',diceBadText:'The bark is too smooth — you slide back down. RUN!',diceBadHp:-15,successNode:'up_the_tree'}]},
foliage_hide_success:{chapter:'Chapter 2 · Rescue or Run?',title:'HIDDEN IN THE LEAVES',emoji:'🌿',text:['You press yourself against a tree and pull leafy branches over your body until you\'re completely covered. The T-Rex shuffles past. Its nostrils hover a metre from your face.','You can smell its breath. Old meat and hot mud.','Then it moves on. You exhale very, very slowly.'],hpChange:5,scoreChange:30,choices:[{text:'🌿 Slip into the jungle',spell:null,successNode:'jungle_edge'}]},
up_the_tree:{chapter:'Chapter 2 · Rescue or Run?',title:'UP IN THE PALM',emoji:'🌴',text:['Twelve feet up, hugging a palm tree, you watch the T-Rex below stare up at you. It is too big to climb. It knows this. It seems annoyed.','It waits. You wait. Eventually it lumbers away, snorting steam.','Ten more minutes. Then you climb down and head into the jungle.'],scoreChange:15,choices:[{text:'🌿 Head into the jungle',spell:null,successNode:'jungle_edge'}]},
cliff_rocks:{chapter:'Chapter 2 · Into the Unknown',title:'THE CLIFF ROCKS',emoji:'🪨',text:['From the rocky base of the cliff you can see the whole beach. The T-Rex — larger than you imagined — lumbers down to the waterline, sniffs, and disappears around the headland.','From this height you can see the island. Far inland, the volcano dominates everything. Near its summit: the glint of metal. Some kind of structure.','To get there, you\'ll need to cross the jungle.'],scoreChange:10,choices:[{text:'🌿 Descend and enter the jungle',spell:null,successNode:'jungle_edge'},{text:'⬆️ Climb higher along the cliffs',spell:'DESOLATE',spellCtx:'The cliffs above look DESOLATE — empty and bleak. Spell it to explore up there:',successNode:'cliff_high',failNode:'jungle_edge',failText:'The cliff face crumbles — you scramble back down.'}]},
cliff_high:{chapter:'Chapter 2 · Into the Unknown',title:'TOP OF THE CLIFFS',emoji:'🏔️',text:['The view from here is magnificent — the entire island spread like a map below you.','Carved into the cliff face, half-hidden by vines: steps. Ancient stone steps leading into a dark passage through the rock.','Someone was here before. Long, long ago.'],scoreChange:20,choices:[{text:'⛩️ Enter the ancient passage',spell:null,successNode:'ancient_passage'},{text:'🌿 Climb down and go through the jungle',spell:null,successNode:'jungle_edge'}]},
ancient_passage:{chapter:'Chapter 3 · Ancient Secrets',title:'THE STONE PASSAGE',emoji:'🕳️',text:['The passage is narrow. The walls are carved with strange symbols: animals, warriors, creatures you don\'t recognise.','Ahead, a faint glow. Blue and shifting. <span class="highlight">Luminous</span> crystals grow from the cave walls, lighting the passage in an eerie beautiful light.','The passage opens into something that makes your jaw drop.'],vocab:'LUMINOUS',choices:[{text:'👀 See what\'s beyond...',spell:null,successNode:'ninja_cave'}]},
palm_point:{chapter:'Chapter 2 · Into the Unknown',title:'THE PALM POINT',emoji:'🌴',text:['The cluster of palms is denser than it looked — almost a small grove with thick undergrowth.','You find a freshwater stream between the roots. You drink gratefully.','From the shade, you watch the T-Rex stomp down the shoreline. Eventually it turns back into the jungle.','The coast is clear.'],hpChange:5,scoreChange:10,choices:[{text:'🌿 Follow the stream into the jungle',spell:null,successNode:'jungle_edge'},{text:'🚢 Go back and try to signal the boat',spell:null,successNode:'signal_weak'}]},
jungle_edge:{chapter:'Chapter 3 · The Jungle',title:'INTO THE JUNGLE',emoji:'🌿',text:['The jungle swallows you whole the moment you step off the beach.','The temperature drops. The air thickens. Dense <span class="highlight">FOLIAGE</span> closes overhead, turning the sky into a dim green patchwork. Birds shriek. Insects drone. Somewhere, water moves.','You check the map. The volcano is north. A structure at the summit could be a radio tower — a way to call for help. But between here and there: miles of this.'],vocab:'FOLIAGE',choices:[{text:'🗺️ Navigate using the map',spell:'NAVIGATE',spellCtx:'To use the map and NAVIGATE through the jungle, spell it:',successNode:'navigate_success',failNode:'navigate_fail',failText:'You misread the map and take a wrong turn.'},{text:'💧 Follow the sound of running water',spell:null,dice:true,diceGoodNode:'navigate_success',diceBadNode:'navigate_fail',diceGoodText:'Smart! The stream leads you the right direction.',diceBadText:'The stream loops in a circle. An hour wasted.',diceBadHp:-5,successNode:'navigate_success'}]},
trex_chase_jungle:{chapter:'Chapter 3 · The Jungle',title:'JUNGLE CHASE!',emoji:'🦖',text:['You crash through the jungle with a T-Rex thundering behind you, smashing trees out of the way like cardboard.','At one point you dive through a hollow log — the T-Rex smashes straight into it, giving you a fifteen-second head start.','Eventually the crashing stops. You\'ve lost it. You collapse against a tree, shaking.','But you\'re alive. And you\'re deep in the jungle.'],hpChange:-25,scoreChange:10,choices:[{text:'💪 Keep going — find that radio tower',spell:null,successNode:'jungle_deep'}]},
navigate_success:{chapter:'Chapter 3 · The Jungle',title:'GOOD PROGRESS',emoji:'✅',text:['Using the map carefully, you find a route along the ridgeline above the worst of the undergrowth. Tough going, but clear.','Hours pass. Your legs ache. Insects find every gap in your clothing.','Then through a break in the trees: the volcano. And near the top — the angular shape of a building. A radio antenna rising from the roof.'],scoreChange:20,choices:[{text:'⛰️ Push toward the radio tower',spell:null,successNode:'jungle_deep'}]},
navigate_fail:{chapter:'Chapter 3 · The Jungle',title:'WRONG WAY',emoji:'😬',text:['An hour of walking and you emerge into a clearing you don\'t recognise. You\'ve gone south instead of north.','In front of you: a wide, fast river. White with foam over rocks. The volcano is on the far side.','You\'re going to have to cross.'],hpChange:-5,choices:[{text:'🌊 Figure out how to cross',spell:null,successNode:'rapids'}]},
jungle_deep:{chapter:'Chapter 3 · The Jungle',title:'DEEP IN THE JUNGLE',emoji:'🦎',text:['The deeper you go, the stranger it gets. Enormous ferns. Luminous fungi glowing blue on fallen logs.','You stop. In the path ahead, coiled around a branch at exactly face height: a snake. Vivid chevron patterns on its scales. Bright warning colours.','You know what bright warning colours mean. This snake is <span class="highlight">VENOMOUS</span>.','"Your next move needs to be exactly right.'],vocab:'VENOMOUS',choices:[{text:'🐍 Back away — very slowly — from the VENOMOUS snake',spell:'VENOMOUS',spellCtx:'Knowing what VENOMOUS means could save your life. Spell it:',successNode:'snake_avoided',failNode:'snake_bitten',failText:'You move too quickly — the snake strikes!'},{text:'🌿 Find a way around through the undergrowth',spell:null,dice:true,diceGoodNode:'snake_avoided',diceBadNode:'snake_bitten',diceGoodText:'You spot a gap and move around without disturbing it.',diceBadText:'You step on a second snake hiding in the leaf litter!',diceBadHp:-20,successNode:'snake_avoided'}]},
snake_avoided:{chapter:'Chapter 3 · The Jungle',title:'SMOOTH MOVES',emoji:'😌',text:['Centimetre by centimetre, you ease backwards. The snake watches with flat black eyes, tongue flickering. Then it slides away into the undergrowth without a sound.','You take a long, shaky breath.','Beyond where it was, ancient stone steps — carved by hand, worn smooth by centuries of rain — lead up through the jungle toward the mountainside.'],scoreChange:20,choices:[{text:'⛩️ Climb the ancient stone steps',spell:null,successNode:'stone_steps'},{text:'⛰️ Push toward the radio tower',spell:null,successNode:'mountain_approach'}]},
snake_bitten:{chapter:'Chapter 3 · The Jungle',title:'OUCH!',emoji:'🤕',text:['The venom makes your arm throb and the edges of your vision go wobbly. Small snake, big human — you won\'t die. Probably.','You press on. Ancient stone steps climb the mountainside ahead.'],hpChange:-25,choices:[{text:'⛩️ Climb the stone steps',spell:null,successNode:'stone_steps'}]},
stone_steps:{chapter:'Chapter 3 · The Jungle',title:'THE ANCIENT STEPS',emoji:'⛩️',text:['The steps are so old the jungle is slowly eating them. Roots crack through the stone. Moss covers every surface. But they lead upward.','As you climb, the trees thin. The light improves. At the top, half-hidden by hanging vines: a cave entrance. Carved pillars. Symbols on the walls.','This is not a random cave.'],scoreChange:15,choices:[{text:'⚔️ Step inside',spell:null,successNode:'ninja_cave'}]},
ninja_cave:{chapter:'Chapter 4 · The Dojo',title:'THE NINJA TRAINING DOJO',emoji:'⚔️',text:['The cave opens into something extraordinary.','A vast underground chamber lit by <span class="highlight">luminous</span> crystals in pale blue and green. And filling every wall: the unmistakable equipment of a ninja training dojo.','Rope courses over a dark pit. Balance beams. Throwing star targets — the stars still embedded after decades. A wall of climbing holds carved into living rock.','Above the far passage, carved in deep letters: "Stillness is strength. Patience is power. The prepared mind survives everything."'],vocab:'LUMINOUS',hpChange:10,scoreChange:30,choices:[{text:'🥷 Train in the dojo — master its challenges',spell:'LUMINOUS',spellCtx:'The LUMINOUS crystals guide worthy students. Prove you belong — spell it:',successNode:'dojo_training',failNode:'cave_through',failText:'You trip on the first balance beam and decide to find another way out.'},{text:'🚶 Find the passage through the mountain',spell:null,successNode:'cave_through'}]},
dojo_training:{chapter:'Chapter 4 · The Dojo',title:'TRAINING MONTAGE',emoji:'🥷',text:['The rope course tests your grip. The balance beams teach you to move your weight slowly. The throwing stars — after you find the angle — hit the targets with a satisfying thunk.','By the time you reach the far passage, your hands are scratched, your arms shake — but you move differently. Quieter. More aware.','The far passage glows with outside light.'],hpChange:20,scoreChange:60,choices:[{text:'🌟 Exit through the far passage',spell:null,successNode:'mountain_exit'}]},
cave_through:{chapter:'Chapter 4 · The Dojo',title:'THROUGH THE MOUNTAIN',emoji:'🕳️',text:['The passage twists through the rock. In places you squeeze sideways. The luminous crystals light the way in blue.','You follow air currents toward the outside — fresh air flows toward exits, a survival trick you once saw Bear Grylls use.','After twenty minutes, the passage ends in a blaze of golden light.'],scoreChange:20,choices:[{text:'☀️ Step out into the light',spell:null,successNode:'mountain_exit'}]},
mountain_exit:{chapter:'Chapter 4 · The Far Side',title:'THE OTHER SIDE',emoji:'🌄',text:['You step onto a narrow ledge on the far side of the mountain and catch your breath.','The view is <span class="highlight">MAGNIFICENT</span>. The island spreads in every direction. On this side: gentler slopes, a small harbour, fishing boats, and lights from what looks like a village.','Between you and it: rough terrain and — you can see even from here — a river.'],vocab:'MAGNIFICENT',scoreChange:25,choices:[{text:'⛰️ Descend carefully',spell:'MAGNIFICENT',spellCtx:'This MAGNIFICENT view — spell it to keep a clear head:',successNode:'descent_good',failNode:'descent_rough',failText:'You start down but the path is harder than it looked.'},{text:'🔍 Look for the radio tower first',spell:null,successNode:'radio_tower'}]},
descent_good:{chapter:'Chapter 4 · The Far Side',title:'MAKING IT DOWN',emoji:'🏔️',text:['The descent is slow but steady. A goat trail zigzags down the steepest sections.','Your legs shake on the harder parts. You cut a walking stick with the penknife. Smart.','The village is close now. And the river between you and it.'],scoreChange:15,choices:[{text:'🌊 Cross the river to the village',spell:null,successNode:'village_approach'}]},
descent_rough:{chapter:'Chapter 4 · The Far Side',title:'ROUGH DESCENT',emoji:'😬',text:['The slope is loose shale. You fall twice, skidding on your hands and knees.','Eventually you reach the bottom, dusty and scraped, but in one piece.'],hpChange:-10,choices:[{text:'🌊 Cross the river',spell:null,successNode:'village_approach'}]},
village_approach:{chapter:'Chapter 4 · The Far Side',title:'SO CLOSE',emoji:'🏘️',text:['The river crossing is nerve-wracking — stepping stones just visible under the surface. Arms out. Not looking down.','Then: a path. The smell of cooking. A fishing village. Twelve houses. A small dock.','A child sees you first and stares. Then she runs, shouting. People come out of doors. Someone hands you water.','You\'ve done it.'],scoreChange:40,choices:[{text:'🏠 You\'re safe!',spell:null,successNode:'end_village'}]},
mountain_approach:{chapter:'Chapter 3 · The Jungle',title:'THE MOUNTAIN',emoji:'⛰️',text:['The slope steepens. The jungle changes — shorter trees, wilder undergrowth, volcanic rock pushing through the soil.','Your legs burn. You rest against a boulder and eat your last supplies.','Above, through cloud, the antenna of a radio tower pokes at the sky.'],hpChange:-5,choices:[{text:'📡 Push up to the radio tower',spell:null,successNode:'radio_tower'}]},
rapids:{chapter:'Chapter 3 · The River',title:'THE RAPIDS',emoji:'🌊',text:['The river is <span class="highlight">TURBULENT</span> — boiling white over black rocks, crashing with terrifying force. You throw in a stick and watch it vanish downstream in seconds.','Upstream: two fallen trees form a rough bridge across a narrow section. Possible, but treacherous.','Downstream: a logjam of driftwood. Enough to build a raft if you knew what you were doing.'],vocab:'TURBULENT',choices:[{text:'🌉 Cross on the fallen tree-bridge',spell:'TREACHEROUS',spellCtx:'It\'s a TREACHEROUS crossing — dangerously risky. Spell it to prepare:',successNode:'tree_bridge',failNode:'tree_bridge_slip',failText:'You step on without thinking it through and immediately slip!'},{text:'🛶 Build a raft from the driftwood',spell:'RESOURCEFUL',spellCtx:'Being RESOURCEFUL means building what you need from what\'s there. Spell it:',successNode:'raft_built',failNode:'raft_wonky',failText:'Your raft is... less impressive than planned.'},{text:'🏊 Try to wade across',spell:null,dice:true,diceGoodNode:'wade_success',diceBadNode:'swept_away',diceGoodText:'The shallows are just manageable — soaked but safe!',diceBadText:'The current grabs you off your feet!',diceBadHp:-25,successNode:'wade_success'}]},
tree_bridge:{chapter:'Chapter 3 · The River',title:'THE LOG CROSSING',emoji:'🌉',text:['Wet mossy wood. Five metres of white water below. Each step: arms out, eyes forward, breathing slow.','Don\'t look down. Don\'t look down.','You look down. Immediately regret it.','Another step. And another. Then the far bank. You step onto solid ground, legs shaking like jelly.'],hpChange:-5,scoreChange:30,choices:[{text:'⛰️ Head for the mountain',spell:null,successNode:'mountain_approach'}]},
tree_bridge_slip:{chapter:'Chapter 3 · The River',title:'SLIPPING!',emoji:'💦',text:['Your foot goes out from under you. You throw yourself sideways and grab the trunk with both arms, dangling over the roaring water.','Pure arm strength and determination. You haul yourself back up and crawl the rest of the way on hands and knees.','Not dignified. But you\'re across.'],hpChange:-15,scoreChange:15,choices:[{text:'⛰️ Onward',spell:null,successNode:'mountain_approach'}]},
raft_built:{chapter:'Chapter 3 · The River',title:'A PROPER RAFT!',emoji:'🛶',text:['An hour of hard work — lashing logs with vine, testing every joint. You push it into the current. It holds.','You pole across with a long bamboo stick. The current pushes you sideways but your raft holds steady.','You step ashore dry. Probably the most satisfying thing that has happened today.'],scoreChange:35,choices:[{text:'⛰️ Head for the mountain',spell:null,successNode:'mountain_approach'}]},
raft_wonky:{chapter:'Chapter 3 · The River',title:'WONKY RAFT',emoji:'💦',text:['Your raft lists dramatically and takes on water. You pole across sitting in six inches of river water, bailing with cupped hands.','Soaked. But across.'],hpChange:-10,scoreChange:15,choices:[{text:'⛰️ Squelch toward the mountain',spell:null,successNode:'mountain_approach'}]},
wade_success:{chapter:'Chapter 3 · The River',title:'ACROSS!',emoji:'✅',text:['Gravel shallows. Arms wide. Current tugging at your ankles but never quite taking your feet off the ground.','Cold, wet, across. Good enough.'],scoreChange:15,choices:[{text:'⛰️ Head for the mountain',spell:null,successNode:'mountain_approach'}]},
swept_away:{chapter:'Chapter 3 · The River',title:'SWEPT DOWNSTREAM!',emoji:'🌊',text:['The current takes you like a toy. You tumble over rocks, swallow freezing water, then — gravel under your hands.','You\'ve been swept to the river mouth where it meets the sea. A boat is anchored offshore.'],hpChange:-30,choices:[{text:'🚢 Swim to the boat',spell:null,dice:true,diceGoodNode:'end_boat',diceBadNode:'end_ocean',diceGoodText:'You reach the boat! The crew haul you aboard!',diceBadText:'The current carries you slowly out to sea...',successNode:'end_boat'}]},
radio_tower:{chapter:'Chapter 5 · The Radio Tower',title:'THE RADIO TOWER',emoji:'📡',text:['Cracked concrete covered in moss. But inside, behind a rusted door: radio equipment, intact.','Rows of dials. A large transmitter. Old logbooks on the desk.','This has been your personal <span class="highlight">EXPEDITION</span>. Time to end it.'],vocab:'EXPEDITION',hpChange:5,scoreChange:30,choices:[{text:'📡 Get the radio working',spell:'EXPEDITION',spellCtx:'This EXPEDITION ends with one radio call. Spell it to power the transmitter:',successNode:'radio_works',failNode:'radio_partial',failText:'You fumble the controls but get a partial signal out.'},{text:'🔧 Figure out the equipment by exploring it',spell:null,dice:true,diceGoodNode:'radio_works',diceBadNode:'radio_partial',diceGoodText:'The controls make sense — you get it working!',diceBadText:'You accidentally broadcast something weird... but a signal is a signal.',successNode:'radio_works'}]},
radio_works:{chapter:'Chapter 5 · The Radio Tower',title:'SIGNAL SENT!',emoji:'🚁',text:['"Mayday, mayday. Crash survivor at radio station on the island. I need rescue."','Static. Then a voice. Clear. Human. "Received. Coast Guard helicopter launching. Estimated arrival — forty minutes."','You sit in the old wooden chair and breathe out a breath you feel like you\'ve been holding for hours.','"Forty minutes," you say to the empty room. "I\'ve survived worse."'],scoreChange:50,choices:[{text:'🚁 Wait for the helicopter',spell:null,successNode:'end_helicopter'}]},
radio_partial:{chapter:'Chapter 5 · The Radio Tower',title:'PARTIAL SIGNAL',emoji:'📻',text:['The transmitter sparks. You manage a location ping — not a voice signal, but enough to broadcast your coordinates.','Four hours later, as the sun goes down and the jungle starts its evening noise, you hear a distant thumping.','A searchlight sweeps through the window.'],scoreChange:25,choices:[{text:'🚁 Signal the helicopter',spell:null,successNode:'end_helicopter'}]},
end_helicopter:{isEnding:true,type:'good',title:'AIRLIFTED TO SAFETY!',emoji:'🚁',text:`Two crew in orange suits come running with a first aid kit and a blanket.

"Are you okay? How long have you been here? Did you eat?"

You take a long breath of non-dinosaur-adjacent air.

"I'm fine," you say. "I used my skills. I navigated the jungle. I avoided predators. I was cautious and resourceful. I used the radio."

The crew look at each other.

"...Predators? Plural?"

"T-Rex. Venomous snake. Treacherous rapids. And a ninja dojo, which was brilliant."

As the helicopter rises above the jungle and the island shrinks below — magnificent, luminous in the setting sun — you realise something.

Every word you knew, every word you learned, every skill you used: it all mattered today.

Knowledge keeps you alive.`,scoreBonus:100},
end_boat:{isEnding:true,type:'good',title:'RESCUED BY BOAT!',emoji:'🚢',text:`The crew wrap you in a blanket smelling magnificently of fish. Hot soup. Best thing ever made by human hands.

"We saw you waving," the captain says. "Very energetically."

"There was a T-Rex," you explain.

The captain nods in the way people nod when they've decided to be polite.

As the island shrinks behind you, you replay everything — the crash, the predator, the ferocious chase, the treacherous jungle. You stayed cautious. You were resourceful. You read the signs.

Survival isn't about being the strongest. It's about being the most prepared.

That was you today.`,scoreBonus:80},
end_village:{isEnding:true,type:'good',title:'FOUND BY THE VILLAGE!',emoji:'🏘️',text:`Within an hour, you're in a warm kitchen eating fish stew while someone's grandmother tuts at your scrapes and applies something that stings considerably.

Through a translator on someone's phone, you try to explain what happened.

The dinosaur part gets skipped. Some things are between you and the island.

By nightfall, a coastguard vessel has arrived with a very relieved adult and a thermos of tea.

"How did you do it?" they ask.

"I read everything carefully. I paid attention to words. Venomous, treacherous, luminous, predator — those words told me exactly what to do. I stayed cautious. I was resourceful. I navigated when I was lost."

On the boat home, you sleep better than you've ever slept in your life.`,scoreBonus:90},
end_ninja:{isEnding:true,type:'secret',title:'🥷 SECRET NINJA ENDING!',emoji:'⚔️',text:`You emerge from the cave onto a ledge bathed in golden light. The ocean spreads below. Distant islands shimmer.

But you don't feel like a rescued survivor.

The dojo changed you. You move differently — quieter, more deliberate, more aware. Every sense sharpened.

When you reach the village below, the fishermen look at you strangely. One very old man, who has lived on the island his whole life, nods slowly.

"You found the old place," he says.

"The dojo," you say.

He nods. "My grandfather's grandfather built it. We thought it was lost."

You look back at the mountain.

"It's not lost," you say. "It was waiting."

🥷 ULTRA SECRET ENDING — You didn't just survive. You levelled up. 🥷`,scoreBonus:150},
end_eaten:{isEnding:true,type:'bad',title:'CHOMPED.',emoji:'🦖',text:`The T-Rex looks extremely pleased with itself. It's doing what can only be described as a victory shuffle, which is impressive given the uselessness of its arms.

The good news is that this is a game, and you can try again.

This time? You know more. You know what wreckage means, and predator, and venomous, and treacherous. You know to be cautious. You know to be resourceful. You know to read the signs.

Every word in this adventure is a survival tool.

Next time, you won't become Gerald's lunch.

...Probably.`,scoreBonus:0},
end_ocean:{isEnding:true,type:'bad',title:'ADRIFT AT SEA...',emoji:'🌊',text:`You are floating in the ocean. This is not the intended outcome.

The island is behind you getting smaller. The T-Rex watches from the beach. Even it seems a bit concerned.

Some dolphins appear. They nudge you thoughtfully.

"I know," you tell them.

The ocean is very large. You are very small. The dolphins, clearly having made a collective decision, nudge you more firmly back toward shore.

They want you to go find the radio tower. You can tell. They're very wise, dolphins.

Press RESTART and this time — head for the mountain.`,scoreBonus:0}}},
egypt:{id:'egypt',title:'Tomb of the Pharaoh',emoji:'🏺',color:'#ffa726',desc:'Deep inside an ancient Egyptian tomb, traps lurk around every corner and the pharaoh\'s secrets await.',tag:'History · Mystery',startNode:'egypt_start',
nodes:{
egypt_start:{chapter:'Chapter 1 · The Excavation',title:'DISCOVERY IN THE DESERT',emoji:'🏜️',text:['The Egyptian sun is merciless. You\'ve been at this <span class="highlight">EXCAVATION</span> site for three days, carefully brushing sand from ancient stones, when suddenly — the ground gives way beneath your trowel.','A hidden entrance. Steps descending into darkness. Cool air rises from below, carrying a smell of dust and something ancient.','Your colleague Dr Nadia left a note: "Gone inside to investigate. Back by noon." That was four hours ago.','You\'re going in.'],vocab:'EXCAVATION',choices:[{text:'🎒 Prepare your kit before entering',spell:'ARCHAEOLOGIST',spellCtx:'A careful ARCHAEOLOGIST always prepares before entering a tomb. Spell it:',successNode:'egypt_prepared',failNode:'egypt_entrance',failText:'You rush in without much preparation — brave, if not entirely wise.'},{text:'🕳️ Go in immediately',spell:null,successNode:'egypt_entrance'}]},
egypt_prepared:{chapter:'Chapter 1 · The Excavation',title:'WELL PREPARED',emoji:'🎒',text:['You take: two torches, spare batteries, a notebook for sketching, a coil of rope, a camera, and water.','An archaeologist never enters an unknown space without a plan. Dr Nadia taught you that.','Now let\'s go find her.'],itemsGain:['Torch 🔦','Rope 🪢','Notebook 📓','Camera 📷'],scoreChange:15,choices:[{text:'🕳️ Enter the tomb',spell:null,successNode:'egypt_entrance'}]},
egypt_entrance:{chapter:'Chapter 2 · Inside the Tomb',title:'THE TOMB ENTRANCE',emoji:'🕳️',text:['The steps descend for thirty metres into the earth. The air cools dramatically. Your torchlight catches the walls — and you stop, breathless.','Every surface is covered in <span class="highlight">HIEROGLYPHICS</span>. Ancient Egyptian writing in pictures and symbols: birds, eyes, seated figures, geometric shapes. They cover the walls from floor to ceiling, telling stories thousands of years old.','Some of the symbols look like warnings.','Others look like instructions.'],vocab:'HIEROGLYPHICS',choices:[{text:'📖 Study the hieroglyphics carefully',spell:'HIEROGLYPHICS',spellCtx:'These HIEROGLYPHICS could contain vital warnings. Spell the word to focus your study:',successNode:'egypt_read_walls',failNode:'egypt_ignore_walls',failText:'You can\'t quite focus on the symbols and press on without reading them.'},{text:'🔦 Press deeper into the corridor',spell:null,successNode:'egypt_ignore_walls'}]},
egypt_read_walls:{chapter:'Chapter 2 · Inside the Tomb',title:'WARNING DECODED',emoji:'📖',text:['You sketch the key symbols in your notebook. Using what you know of Egyptian hieroglyphics, you piece together a message:','— "The corridor ahead holds three tests. Step on the serpent\'s eye and fire will fall. Touch the golden ibis and the floor will swallow you. Speak the sacred name and the way will open."','You write it all down. This is incredibly useful.','Somewhere deeper in, you hear a distant voice — Dr Nadia! She\'s alive.'],scoreChange:25,choices:[{text:'🚶 Move carefully into the corridor',spell:null,successNode:'egypt_corridor'}]},
egypt_ignore_walls:{chapter:'Chapter 2 · Inside the Tomb',title:'INTO THE UNKNOWN',emoji:'🔦',text:['The corridor stretches before you, torchlight swallowed by the darkness ahead.','You call out: "Dr Nadia?" Your voice echoes strangely.','A distant reply — muffled, but there. She\'s alive. She\'s deeper in.'],choices:[{text:'🚶 Move into the corridor',spell:null,successNode:'egypt_corridor'}]},
egypt_corridor:{chapter:'Chapter 2 · Inside the Tomb',title:'THE SUBTERRANEAN CORRIDOR',emoji:'🌑',text:['The corridor is long and perfectly straight. The air is utterly still — the same air that has been here for 3,000 years.','You are entirely <span class="highlight">SUBTERRANEAN</span> now — completely underground, beneath metres of desert above you. The weight of all that sand and stone presses on your imagination.','Painted on the floor: patterns. Some tiles look slightly different from others. Your hand goes instinctively to your notebook — those warnings you sketched...'],vocab:'SUBTERRANEAN',choices:[{text:'👣 Step carefully using the warnings you noted',spell:'SUBTERRANEAN',spellCtx:'Spell SUBTERRANEAN to focus your mind underground:',successNode:'egypt_corridor_safe',failNode:'egypt_trap_triggered',failText:'You lose your concentration and your foot lands wrong!'},{text:'🏃 Move quickly down the centre',spell:null,dice:true,diceGoodNode:'egypt_corridor_safe',diceBadNode:'egypt_trap_triggered',diceGoodText:'You move fast and lucky — every step lands right!',diceBadText:'One foot goes wrong! A hidden mechanism clicks...',diceBadHp:-15,successNode:'egypt_corridor_safe'}]},
egypt_corridor_safe:{chapter:'Chapter 2 · Inside the Tomb',title:'CORRIDOR CLEARED',emoji:'✅',text:['Slow, careful steps. One tile at a time. The warnings in your notebook guide your feet.','At one point your torch picks out a nearly-invisible seam in the floor — a pressure plate. You step over it with centimetres to spare.','The corridor ends in a carved doorway. Beyond it: a chamber glowing with golden light.'],scoreChange:20,choices:[{text:'🏛️ Enter the chamber',spell:null,successNode:'egypt_chamber'}]},
egypt_trap_triggered:{chapter:'Chapter 2 · Inside the Tomb',title:'TRAP!',emoji:'💥',text:['A pressure plate clicks beneath your foot. You leap sideways as a blade swings through the air where your head was half a second ago.','Your heart hammers. Your ears ring.','But you\'re through. Bruised, shaken, but through. The chamber ahead glows golden.'],hpChange:-20,choices:[{text:'🏛️ Enter the chamber — carefully',spell:null,successNode:'egypt_chamber'}]},
egypt_chamber:{chapter:'Chapter 3 · The Inner Tomb',title:'THE BURIAL CHAMBER',emoji:'⚱️',text:['The chamber is astonishing. Painted walls show scenes of ancient Egyptian life — hunting, feasting, sailing the Nile. Canopic jars line the walls. And in the centre, dominating everything:','A <span class="highlight">SARCOPHAGUS</span>. Enormous. Stone, but gilded with gold that still gleams after three thousand years. A carved face on the lid stares serenely at the ceiling.','Beside it, cross-legged on the floor with a torch and a notebook, is Dr Nadia. She looks up.','Of course it\'s you," she says. "I should have known. Come and look at this inscription."'],vocab:'SARCOPHAGUS',choices:[{text:'📜 Read the inscription with Dr Nadia',spell:'INSCRIPTION',spellCtx:'The INSCRIPTION carved on the walls holds the key to the labyrinth beyond. Spell it:',successNode:'egypt_inscription_read',failNode:'egypt_inscription_miss',failText:'You struggle to focus and Dr Nadia has to read it aloud to you instead.'},{text:'👀 Explore the rest of the chamber',spell:null,successNode:'egypt_inscription_miss'}]},
egypt_inscription_read:{chapter:'Chapter 3 · The Inner Tomb',title:'THE INSCRIPTION DECODED',emoji:'📜',text:['Working together, you and Dr Nadia decode the inscription. It\'s a message from the pharaoh\'s head priest, written 3,000 years ago:','"Those who seek the sacred way must pass through the eternal labyrinth. Left at the falcon. Right at the hawk. Straight at the scarab. The door opens for those who carry the name of the sun."','Dr Nadia scribbles furiously in her notebook. "This is extraordinary. This is a MAP of the labyrinth!"','You feel a warm glow of achievement. You didn\'t just read the inscription — you might have just saved both your lives.'],scoreChange:35,choices:[{text:'🌀 Head into the labyrinth',spell:null,successNode:'egypt_labyrinth'}]},
egypt_inscription_miss:{chapter:'Chapter 3 · The Inner Tomb',title:'THE LABYRINTH AHEAD',emoji:'🌀',text:['"The passage behind this sarcophagus leads to a labyrinth," Dr Nadia explains. "I went in briefly — it\'s enormous. Without a guide, I didn\'t dare go further."','"Any clues about the way through?" you ask.','"There\'s an inscription," she says, gesturing. "But I haven\'t had time to decode it all."','You peer at it. Some of the symbols seem to show directions...'],choices:[{text:'🌀 Enter the labyrinth together',spell:null,successNode:'egypt_labyrinth'}]},
egypt_labyrinth:{chapter:'Chapter 4 · The Labyrinth',title:'THE LABYRINTH',emoji:'🌀',text:['The <span class="highlight">LABYRINTH</span> beneath the pyramid is unlike anything you\'ve ever experienced. Passage after passage, branching left and right, all identical, all lit only by your torches.','The air is thick with the smell of ancient stone. Your footsteps echo in directions they shouldn\'t.','Without directions you would be lost within minutes. This was designed to trap tomb robbers forever.'],vocab:'LABYRINTH',choices:[{text:'🗺️ Navigate using the inscription clues',spell:'LABYRINTH',spellCtx:'To navigate this LABYRINTH, you need to keep a clear head. Spell it:',successNode:'egypt_labyrinth_navigate',failNode:'egypt_labyrinth_lost',failText:'You take a wrong turn and have to backtrack, losing precious torch battery.'},{text:'🧵 Leave a trail to follow back',spell:null,dice:true,diceGoodNode:'egypt_labyrinth_navigate',diceBadNode:'egypt_labyrinth_lost',diceGoodText:'Your trail method works perfectly — you find the right path!',diceBadText:'Your trail gets confused with itself. You loop in circles.',diceBadHp:-10,successNode:'egypt_labyrinth_navigate'}]},
egypt_labyrinth_navigate:{chapter:'Chapter 4 · The Labyrinth',title:'THROUGH THE MAZE',emoji:'✅',text:['"Left at the falcon." You turn left at a carved falcon relief.','Right at the hawk." Right at the hawk-headed figure.','Straight at the scarab." You walk straight past the scarab beetle carving.','A door appears. Tall, stone, engraved with a sun disc. Above it, in hieroglyphics: one word. The name of the sun.'],scoreChange:30,choices:[{text:'☀️ Speak the sacred name',spell:'PHARAOH',spellCtx:'The sacred name that opens the door is the title of Egypt\'s ruler — PHARAOH. Spell it:',successNode:'egypt_inner_sanctum',failNode:'egypt_inner_sanctum',failText:'Dr Nadia whispers it for you — the door still opens.'}]},
egypt_labyrinth_lost:{chapter:'Chapter 4 · The Labyrinth',title:'DISORIENTED',emoji:'😵',text:['The passages blur together. Left, right, left, right — you\'ve lost track completely.','Dr Nadia stays calm. "Systematic. We mark every passage we\'ve tried. Slowly."','An hour later — torches significantly dimmer — you find the door.'],hpChange:-10,choices:[{text:'☀️ Face the final door',spell:null,successNode:'egypt_inner_sanctum'}]},
egypt_inner_sanctum:{chapter:'Chapter 5 · The Sacred Chamber',title:'THE INNER SANCTUM',emoji:'✨',text:['Beyond the door: the <span class="highlight">PHARAOH\'s</span> innermost sacred chamber. The walls are covered in PAPYRUS scrolls sealed in glass-like resin. Golden artefacts. The most priceless collection of antiquities discovered in decades.','Dr Nadia is speechless. Then: "We need to document everything before we touch anything. These objects are SACRED — they belong to history, not to us."','She\'s right. You begin photographing, sketching, noting everything carefully.','This is the discovery of the century. And you found it.'],vocab:'PHARAOH',hpChange:10,scoreChange:40,choices:[{text:'📷 Document everything respectfully',spell:'SACRED',spellCtx:'These SACRED objects must be treated with respect. Spell the word:',successNode:'egypt_escape_good',failNode:'egypt_escape_good',failText:'Dr Nadia guides you — together you record everything perfectly.'}]},
egypt_escape_good:{chapter:'Chapter 5 · The Exit',title:'THE WAY OUT',emoji:'🌅',text:['Hours later, with memory cards full of photographs and notebooks full of sketches, you and Dr Nadia find a second exit passage — one the ancient Egyptians must have used for construction.','It leads upward. Light appears. Warm desert air.','You emerge into the evening sunlight, covered in ancient dust, carrying evidence of the greatest Egyptian discovery in a generation.','Dr Nadia looks at you.','Not bad," she says, "for someone who just wandered in."'],scoreChange:30,choices:[{text:'🏆 See how the story ends!',spell:null,successNode:'end_egypt_triumph'}]},
end_egypt_triumph:{isEnding:true,type:'good',title:'DISCOVERY OF THE CENTURY!',emoji:'🏺',text:`The discovery makes international news within 48 hours.

The chamber is named "The Nadia-Williams Tomb" — your name on it, right there in the history books, forever.

Experts say the papyrus scrolls alone will take twenty years to fully translate. The hieroglyphics you copied in your notebook turn out to be a previously unknown text about Egyptian medicine.

You did that. You read the walls. You decoded the inscription. You navigated the labyrinth. You respected the sacred space and treated the antiquities with care.

Dr Nadia writes in her paper: "I would not have found the inner sanctum without my extraordinary young colleague, who combined curiosity, courage, and the ability to read very, very carefully."

Knowledge of words — ancient words, carved words, written words — changed history today.

And that history has your name on it.`,scoreBonus:100},
end_egypt_explorer:{isEnding:true,type:'good',title:'JUNIOR ARCHAEOLOGIST!',emoji:'⛏️',text:`You emerge from the tomb as the sun sets over the desert, notebooks full and camera full.

The excavation team outside stares at you. Dr Nadia steps forward.

"She found the inner sanctum," she announces simply. "And she read the inscription that got us through the labyrinth."

There is a long, respectful silence.

That evening, around the camp fire, Dr Nadia hands you a small bronze trowel — the traditional gift given when an archaeologist mentors their first discovery.

"Welcome," she says, "to the profession."

You look at the trowel. Then at the stars above the desert. The same stars the pharaoh looked at, three thousand years ago.

Some things, you think, are worth reading very carefully.`,scoreBonus:80},
end_egypt_mummy:{isEnding:true,type:'bad',title:'THE MUMMY WOKE UP.',emoji:'😱',text:`Look. In your defence, you were curious about the sarcophagus lid mechanism. Most people would have been curious.

The fact that pressing it caused the lid to open is just bad luck.

The fact that something was inside is also just bad luck.

The fact that it appears to be extremely annoyed is perhaps not entirely surprising, given that it hasn't had visitors in 3,000 years and you did just break in.

You are currently running. The mummy is currently shuffling. You have a significant speed advantage, which is reassuring.

Dr Nadia, to her credit, is also running and simultaneously taking photographs. This is what archaeologists call "dedication to the field."

Press RESTART — and this time, perhaps leave the sarcophagus lid alone.`,scoreBonus:0}}},
europe:{id:'europe',title:'The Missing Masterpiece',emoji:'🗼',color:'#2196f3',desc:'A stolen painting. Clues across four countries. Learn to speak French, Spanish, Italian and German as you chase the thief.',tag:'Languages · Mystery',startNode:'eu_start',
nodes:{
eu_start:{chapter:'Chapter 1 · Paris, France 🇫🇷',title:'PARIS, FRANCE',emoji:'🗼',text:['The Eiffel Tower rises above the Paris rooftops as you step out of the Metro. You\'re here because a famous painting — the "Jade Serpent", priceless — was stolen from the Louvre yesterday.','A note left at the scene is in four languages. The first line is French.','A baker outside her shop catches your eye and smiles: "<span class="highlight">BONJOUR</span>!" she says cheerfully.','That\'s your first French word. Hello. You\'re going to need more of them.'],vocab:'BONJOUR',choices:[{text:'🥐 Greet the baker — say BONJOUR back!',spell:'BONJOUR',spellCtx:'Greet the baker properly — spell the French word for hello:',successNode:'eu_paris_local',failNode:'eu_paris_lost',failText:'You mumble something. She gives you a slightly puzzled look but helps anyway.'},{text:'🗺️ Find the Louvre on your own',spell:null,successNode:'eu_paris_lost'}]},
eu_paris_local:{chapter:'Chapter 1 · Paris, France 🇫🇷',title:'MADE A FRIEND!',emoji:'😊',text:['The baker beams. "Ah, you speak French! Excellent!" She\'s heard about the stolen painting — the whole neighbourhood is talking about it.','She points you toward the Louvre and gives you a warm croissant for the journey. As you leave, she calls after you: "Bonne chance — good luck!"','You\'ve learned something crucial: in any country, trying to speak the local language — even just one word — changes everything.'],scoreChange:20,choices:[{text:'🏛️ Head to the Louvre',spell:null,successNode:'eu_paris_clue'}]},
eu_paris_lost:{chapter:'Chapter 1 · Paris, France 🇫🇷',title:'LOST IN PARIS',emoji:'😅',text:['The Parisian streets are a beautiful maze of old stone buildings and cobblestone alleys. You take three wrong turns, cross a bridge twice, and accidentally end up at a cheese shop (not entirely a waste of time).','Eventually you find the Louvre. A security guard hands you the thief\'s note.'],hpChange:-5,choices:[{text:'📜 Read the note',spell:null,successNode:'eu_paris_clue'}]},
eu_paris_clue:{chapter:'Chapter 1 · Paris, France 🇫🇷',title:'THE FIRST CLUE',emoji:'📜',text:['The thief\'s note reads: "The painting travels east to west. First stop: a city where <span class="highlight">COBBLESTONE</span> streets surround a famous architect\'s unfinished masterpiece. Find the hidden compartment in the great market."','Cobblestone streets. An unfinished masterpiece. A great market.','An expert at the Louvre says: "That\'s Barcelona. Gaudí\'s Sagrada Família cathedral — still unfinished after 140 years."','You help clear away her coffee cups. "MERCI!" she says. That\'s your second French word — thank you.'],vocab:'COBBLESTONE',choices:[{text:'✈️ Fly to Barcelona',spell:'MERCI',spellCtx:'Say MERCI — thank you in French — as you leave. Spell it:',successNode:'eu_spain',failNode:'eu_spain',failText:'You forget to say merci as you rush out. The expert sighs.'}]},
eu_spain:{chapter:'Chapter 2 · Barcelona, Spain 🇪🇸',title:'BARCELONA, SPAIN',emoji:'🏟️',text:['Barcelona is warm, loud, and spectacular. The famous <span class="highlight">CATHEDRAL</span> of the Sagrada Família rises ahead of you — a forest of stone towers still being built after more than a century, because Gaudí designed something so extraordinary it has taken generations to build.','A market stall owner catches your eye. "¡<span class="highlight">HOLA</span>!" she calls. That\'s Spanish for hello.','The clue says to find a hidden compartment in the great market nearby — La Boqueria.'],vocab:'HOLA',choices:[{text:'🛍️ Greet the stall owner — say HOLA!',spell:'HOLA',spellCtx:'Greet her in Spanish — spell HOLA:',successNode:'eu_spain_local',failNode:'eu_spain_alone',failText:'You wave awkwardly. She shrugs and continues selling tomatoes.'},{text:'🔍 Search the market on your own',spell:null,successNode:'eu_spain_alone'}]},
eu_spain_local:{chapter:'Chapter 2 · Barcelona, Spain 🇪🇸',title:'¡HOLA!',emoji:'😄',text:['The stall owner lights up. "¡Hola! You speak Spanish!" She\'s seen someone suspicious near the old spice merchant\'s stall — a person in a grey coat carrying a long tube case (perfect for rolled-up paintings).','She shows you exactly where to look. As you head off, she calls: "¡Buena suerte — good luck!"','You wave back. "¡Gracias!" you call — and immediately know you\'ve learned another word. Thank you.'],scoreChange:25,choices:[{text:'🔍 Find the hidden compartment',spell:null,successNode:'eu_spain_clue'}]},
eu_spain_alone:{chapter:'Chapter 2 · Barcelona, Spain 🇪🇸',title:'SEARCHING THE MARKET',emoji:'🔍',text:['The market is enormous, colourful and slightly overwhelming. Stalls sell fruit, fish, spices, hams, flowers, sweets. The smell is extraordinary.','After an hour of searching, you find it — a loose stone behind the oldest spice stall, with a small sealed envelope wedged behind it.'],hpChange:-5,choices:[{text:'📜 Open the envelope',spell:null,successNode:'eu_spain_clue'}]},
