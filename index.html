<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>READ · WRITE · SURVIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080f08;
  --panel: #0d1f0d;
  --panel2: #122412;
  --border: #1e4a1e;
  --accent: #4caf50;
  --amber: #ffa726;
  --red: #f44336;
  --text: #ddeedd;
  --subtext: #8ab08a;
  --gold: #ffd700;
  --purple: #ce93d8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 15% 40%, rgba(10, 50, 10, 0.4) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 20%, rgba(5, 30, 5, 0.5) 0%, transparent 55%);
}

/* ── HEADER ── */
#header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(8,15,8,0.96);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid var(--border);
  padding: 10px 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
#game-title {
  font-family: 'Bangers', cursive; font-size: 1.35rem;
  letter-spacing: 3px; color: var(--gold);
  text-shadow: 0 0 18px rgba(255,215,0,0.5); flex-shrink: 0;
}
.stat { display: flex; align-items: center; gap: 5px; font-size: 0.82rem; font-weight: 700; }
#hp-wrap { flex:1; min-width:80px; max-width:160px; height:11px; background:rgba(255,255,255,0.08); border-radius:6px; overflow:hidden; }
#hp-bar { height:100%; border-radius:6px; transition: width 0.5s ease, background 0.5s; }
#score-val { color: var(--gold); }
#chapter-display { color: var(--subtext); font-size:0.78rem; margin-left:auto; font-style:italic; }

/* ── MAIN ── */
#main { max-width: 680px; margin: 0 auto; padding: 22px 16px 80px; }

/* ── SCENE CARD ── */
.scene-card {
  background: var(--panel); border: 2px solid var(--border);
  border-radius: 16px; overflow: hidden; margin-bottom: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  animation: slideIn 0.35s ease;
}
@keyframes slideIn {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}
.scene-header {
  background: linear-gradient(135deg, var(--panel2), #142814);
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.scene-emoji { font-size: 2rem; }
.scene-title-wrap { flex:1; }
.scene-title { font-family:'Bangers',cursive; font-size:1.55rem; letter-spacing:2px; color:var(--gold); text-shadow:0 0 14px rgba(255,215,0,0.4); }
.scene-chapter { font-size:0.75rem; color:var(--subtext); text-transform:uppercase; letter-spacing:1px; margin-top:1px; }
.scene-body { padding:20px; font-size:1.05rem; line-height:1.75; }
.scene-body p { margin-bottom:13px; }
.scene-body p:last-child { margin-bottom:0; }
.highlight { color:var(--gold); font-weight:900; }

/* ── VOCAB BOX ── */
.vocab-box {
  margin:16px 0; padding:14px 16px;
  background:rgba(255,215,0,0.07); border:1px solid rgba(255,215,0,0.25);
  border-radius:10px; border-left:4px solid var(--gold);
}
.vocab-word { font-family:'Bangers',cursive; font-size:1.25rem; color:var(--gold); letter-spacing:2px; }
.vocab-def  { font-size:0.93rem; color:var(--subtext); margin-top:4px; }
.vocab-example { font-size:0.88rem; color:rgba(255,215,0,0.55); margin-top:3px; font-style:italic; }

/* ── ITEM GAIN ── */
.item-gain {
  margin:12px 0; padding:12px 14px;
  background:rgba(76,175,80,0.09); border:1px solid rgba(76,175,80,0.25);
  border-radius:10px; border-left:4px solid #4caf50;
}
.item-gain-label { font-weight:900; color:#81c784; margin-bottom:5px; font-size:0.9rem; }
.item-gain-list  { color:var(--subtext); font-size:0.92rem; }

/* ── HP/SCORE CHIPS ── */
.stat-chip { display:inline-block; padding:2px 9px; border-radius:12px; font-weight:900; font-size:0.85rem; margin-left:8px; }
.chip-neg  { background:rgba(244,67,54,0.18); color:#f44336; }
.chip-pos  { background:rgba(76,175,80,0.18); color:#81c784; }

/* ── CHOICES ── */
.choices-wrap { padding:0 20px 20px; }
.choices-label { font-size:0.8rem; color:var(--subtext); text-transform:uppercase; letter-spacing:1px; margin-bottom:11px; }
.choice-btn {
  width:100%; padding:13px 16px; margin-bottom:9px;
  border:none; border-radius:12px; cursor:pointer;
  font-family:'Nunito',sans-serif; font-size:0.97rem; font-weight:700;
  text-align:left; transition:all 0.2s ease;
  display:flex; align-items:center; gap:10px;
}
.choice-btn:hover { transform:translateY(-2px); }
.choice-free  { background:linear-gradient(135deg,#1b5e20,#2e7d32); color:#c8e6c9; border:1px solid #388e3c; }
.choice-free:hover  { box-shadow:0 5px 18px rgba(76,175,80,0.35); }
.choice-spell { background:linear-gradient(135deg,#bf360c,#e64a19); color:#fbe9e7; border:1px solid #ff5722; }
.choice-spell:hover { box-shadow:0 5px 18px rgba(255,87,34,0.35); }
.badge {
  margin-left:auto; flex-shrink:0; padding:2px 8px; border-radius:8px;
  font-size:0.75rem; letter-spacing:0.5px; background:rgba(255,255,255,0.15);
}

/* ── SPELL OVERLAY ── */
#spell-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.88); z-index:200;
  align-items:center; justify-content:center;
  padding:20px; backdrop-filter:blur(6px);
}
#spell-overlay.active { display:flex; }
.spell-card {
  background:var(--panel); border:2px solid var(--amber);
  border-radius:20px; padding:28px; max-width:430px; width:100%;
  box-shadow:0 0 60px rgba(255,167,38,0.2);
  animation:popIn 0.28s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes popIn {
  from { opacity:0; transform:scale(0.82); }
  to   { opacity:1; transform:scale(1); }
}
.spell-head  { font-family:'Bangers',cursive; font-size:1.3rem; color:var(--amber); letter-spacing:2px; margin-bottom:6px; }
.spell-ctx   { font-size:0.88rem; color:var(--subtext); margin-bottom:10px; }
.spell-target { font-family:'Bangers',cursive; font-size:2.8rem; color:var(--gold); letter-spacing:6px; text-align:center; margin:8px 0 4px; text-shadow:0 0 18px rgba(255,215,0,0.45); }
.spell-def   { text-align:center; color:var(--subtext); font-size:0.9rem; margin-bottom:18px; font-style:italic; }
.spell-input {
  width:100%; background:rgba(255,255,255,0.06);
  border:2px solid var(--border); border-radius:10px;
  padding:13px 16px; color:var(--text);
  font-family:'Bangers',cursive; font-size:1.7rem;
  letter-spacing:4px; text-align:center; text-transform:uppercase;
  outline:none; transition:border-color 0.2s;
}
.spell-input:focus { border-color:var(--amber); box-shadow:0 0 18px rgba(255,167,38,0.2); }
.spell-input.correct { border-color:#4caf50; background:rgba(76,175,80,0.1); animation:correctPulse 0.45s ease; }
.spell-input.wrong   { border-color:#f44336; background:rgba(244,67,54,0.1); animation:wrongShake 0.45s ease; }
@keyframes correctPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.02)} }
@keyframes wrongShake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }
.spell-tries  { text-align:center; font-size:0.8rem; color:var(--subtext); margin-top:6px; }
.spell-hint-btn { background:none; border:none; color:var(--subtext); font-family:'Nunito',sans-serif; font-size:0.83rem; cursor:pointer; text-decoration:underline; margin-top:6px; display:block; text-align:center; width:100%; }
.spell-hint-box { display:none; text-align:center; color:var(--subtext); font-size:0.88rem; margin-top:7px; padding:8px; background:rgba(255,255,255,0.04); border-radius:8px; }
.spell-result { display:none; text-align:center; padding:12px; border-radius:10px; margin-top:10px; font-weight:700; font-size:0.95rem; }
.spell-result.show { display:block; }
.spell-result.ok   { background:rgba(76,175,80,0.14); color:#81c784; border:1px solid #4caf50; }
.spell-result.bad  { background:rgba(244,67,54,0.14); color:#e57373; border:1px solid #f44336; }
.spell-submit {
  width:100%; margin-top:14px; padding:13px;
  background:linear-gradient(135deg,#e65100,#ffa726);
  border:none; border-radius:10px; color:#fff;
  font-family:'Bangers',cursive; font-size:1.25rem; letter-spacing:2px; cursor:pointer; transition:all 0.2s;
}
.spell-submit:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(255,167,38,0.4); }
.spell-skip {
  width:100%; margin-top:8px; padding:10px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
  border-radius:8px; color:var(--subtext);
  font-family:'Nunito',sans-serif; font-size:0.87rem; cursor:pointer;
}

/* ── DICE OVERLAY ── */
#dice-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.84); z-index:200;
  align-items:center; justify-content:center;
  flex-direction:column; gap:18px;
}
#dice-overlay.active { display:flex; }
#dice-face { font-size:5.5rem; animation:diceRoll 0.9s ease; }
@keyframes diceRoll {
  0%   { transform:rotate(0deg) scale(0.4); opacity:0; }
  35%  { transform:rotate(200deg) scale(1.2); opacity:1; }
  65%  { transform:rotate(320deg) scale(0.9); }
  100% { transform:rotate(360deg) scale(1); }
}
#dice-msg { font-family:'Bangers',cursive; font-size:1.5rem; color:var(--gold); letter-spacing:2px; text-align:center; max-width:320px; padding:0 20px; }
#dice-cont { padding:12px 32px; background:var(--accent); border:none; border-radius:10px; color:#fff; font-family:'Bangers',cursive; font-size:1.15rem; letter-spacing:2px; cursor:pointer; transition:all 0.2s; }
#dice-cont:hover { transform:translateY(-2px); box-shadow:0 5px 16px rgba(76,175,80,0.4); }

/* ── FLASH ── */
#flash { display:none; position:fixed; inset:0; z-index:300; align-items:center; justify-content:center; pointer-events:none; }
#flash.active { display:flex; }
#flash-text { font-family:'Bangers',cursive; font-size:3.5rem; letter-spacing:4px; animation:flashAnim 1.1s ease forwards; }
#flash-text.ok  { color:#69f0ae; text-shadow:0 0 28px rgba(105,240,174,0.8); }
#flash-text.bad { color:#ff5252; text-shadow:0 0 28px rgba(255,82,82,0.8); }
@keyframes flashAnim {
  0%   { opacity:0; transform:scale(0.5); }
  30%  { opacity:1; transform:scale(1.1); }
  70%  { opacity:1; transform:scale(1); }
  100% { opacity:0; transform:scale(0.85) translateY(-28px); }
}

/* ── ENDING ── */
.ending-wrap { text-align:center; padding:36px 20px; }
.ending-big-emoji { font-size:4rem; margin-bottom:14px; }
.ending-title { font-family:'Bangers',cursive; font-size:2.4rem; letter-spacing:4px; margin-bottom:14px; }
.ending-title.good   { color:var(--gold); text-shadow:0 0 18px rgba(255,215,0,0.5); }
.ending-title.bad    { color:#f44336; text-shadow:0 0 18px rgba(244,67,54,0.5); }
.ending-title.secret { color:var(--purple); text-shadow:0 0 18px rgba(206,147,216,0.5); }
.ending-body { font-size:1.05rem; line-height:1.8; max-width:500px; margin:0 auto 22px; }
.ending-body p { margin-bottom:14px; }
.final-score { font-family:'Bangers',cursive; font-size:2rem; color:var(--gold); margin-bottom:20px; }
.words-panel {
  background:rgba(255,215,0,0.07); border:1px solid rgba(255,215,0,0.25);
  border-radius:12px; padding:18px; margin:16px auto 24px; max-width:500px; text-align:left;
}
.words-panel h3 { font-family:'Bangers',cursive; font-size:1.15rem; color:var(--gold); letter-spacing:2px; margin-bottom:12px; text-align:center; }
.word-row { padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; gap:10px; font-size:0.92rem; flex-wrap:wrap; }
.word-row:last-child { border-bottom:none; }
.wr-word { color:var(--gold); font-weight:900; min-width:130px; flex-shrink:0; }
.wr-def  { color:var(--subtext); }
.spelled-line { margin:0 auto 16px; max-width:500px; color:var(--subtext); font-size:0.88rem; }
.spelled-line strong { color:var(--gold); }
.restart-btn {
  padding:15px 40px; background:linear-gradient(135deg,#1b5e20,#388e3c);
  border:2px solid #4caf50; border-radius:12px; color:#fff;
  font-family:'Bangers',cursive; font-size:1.35rem; letter-spacing:2px; cursor:pointer; transition:all 0.2s;
}
.restart-btn:hover { transform:translateY(-3px); box-shadow:0 8px 22px rgba(76,175,80,0.4); }

/* ── RESPONSIVE ── */
@media (max-width:480px) {
  .scene-title { font-size:1.25rem; }
  .scene-body  { font-size:0.95rem; }
  .spell-target { font-size:2rem; letter-spacing:4px; }
  #flash-text { font-size:2.4rem; }
  .ending-title { font-size:1.8rem; }
}
</style>
</head>
<body>

<div id="header">
  <div id="game-title">⚡ READ · WRITE · SURVIVE</div>
  <div class="stat">❤️ <div id="hp-wrap"><div id="hp-bar"></div></div></div>
  <div class="stat" id="score-val">⭐ 0</div>
  <div id="chapter-display"></div>
</div>

<div id="main"><div id="game-area"></div></div>

<!-- Spelling Overlay -->
<div id="spell-overlay">
  <div class="spell-card">
    <div class="spell-head">🔤 SPELLING CHALLENGE!</div>
    <div class="spell-ctx" id="s-ctx"></div>
    <div class="spell-target" id="s-word"></div>
    <div class="spell-def" id="s-def"></div>
    <input class="spell-input" id="s-input" type="text" placeholder="TYPE IT HERE"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="spell-tries" id="s-tries"></div>
    <button class="spell-hint-btn" onclick="toggleHint()">💡 Need a hint?</button>
    <div class="spell-hint-box" id="s-hint"></div>
    <div class="spell-result" id="s-result"></div>
    <button class="spell-submit" id="s-btn">SUBMIT ➤</button>
    <button class="spell-skip" id="s-skip" style="display:none" onclick="skipSpell()">Take the other path instead →</button>
  </div>
</div>

<!-- Dice Overlay -->
<div id="dice-overlay">
  <div id="dice-face">🎲</div>
  <div id="dice-msg"></div>
  <button id="dice-cont">CONTINUE ➤</button>
</div>

<!-- Flash -->
<div id="flash"><div id="flash-text"></div></div>

<script>
// ═══════════════════════════════════════════════════════════
// VOCABULARY BANK
// ═══════════════════════════════════════════════════════════
const VOCAB = {
  WRECKAGE:     { def: 'the twisted, broken remains left after a crash or disaster', ex: 'Smoke rose from the wreckage of the plane.' },
  TREACHEROUS:  { def: 'extremely dangerous, full of hidden risks that are hard to spot', ex: 'The treacherous cliff path crumbled at every step.' },
  PREDATOR:     { def: 'a creature that hunts and kills other animals to survive', ex: 'The lion is Africa\'s most fearsome predator.' },
  CAMOUFLAGE:   { def: 'disguising yourself so you blend into your surroundings and can\'t be seen', ex: 'Soldiers use camouflage to hide from the enemy.' },
  FOLIAGE:      { def: 'the leaves and branches of trees and plants, especially dense ones', ex: 'She hid behind the thick tropical foliage.' },
  FEROCIOUS:    { def: 'savagely fierce, violent and terrifyingly aggressive', ex: 'The ferocious storm ripped trees from the ground.' },
  RESOURCEFUL:  { def: 'clever at finding creative solutions using whatever is available', ex: 'He was so resourceful he built a shelter from bamboo and vine.' },
  NAVIGATE:     { def: 'to plan and follow a route to get from one place to another', ex: 'Using the stars, she could navigate across the ocean.' },
  LUMINOUS:     { def: 'glowing with bright light, as if producing its own glow from within', ex: 'The luminous mushrooms lit the cave walls in blue.' },
  VENOMOUS:     { def: 'able to inject poison through a bite or sting — dangerously toxic', ex: 'Never approach a venomous snake in the wild.' },
  THUNDEROUS:   { def: 'making an enormous, deep sound like a crack of thunder', ex: 'The thunderous roar shook the very ground beneath them.' },
  EXPEDITION:   { def: 'a journey made for a specific dangerous or exciting purpose', ex: 'The expedition team discovered an uncharted jungle.' },
  SILHOUETTE:   { def: 'the dark shape or outline of something seen against a bright background', ex: 'She saw the silhouette of a ship on the horizon.' },
  MAGNIFICENT:  { def: 'impressively beautiful and awe-inspiring, truly spectacular', ex: 'The waterfall was the most magnificent thing he\'d ever seen.' },
  DESOLATE:     { def: 'completely empty, abandoned and bleakly lifeless', ex: 'The island looked totally desolate — not a person in sight.' },
  TURBULENT:    { def: 'full of sudden movement, disorder and violent change', ex: 'The turbulent river smashed the raft against the rocks.' },
  CAUTIOUS:     { def: 'being very careful and aware to avoid danger or making mistakes', ex: 'She was cautious — she checked every step before taking it.' },
  GLISTENING:   { def: 'shining with reflected light, especially from water or sweat', ex: 'The glistening ocean stretched to the horizon.' },
  REMNANTS:     { def: 'small pieces or traces of something left behind after most is gone', ex: 'Only the remnants of the ancient camp remained.' },
  PERILOUS:     { def: 'full of serious and immediate danger — seriously risky', ex: 'Crossing the rope bridge was perilous but their only option.' },
};

// ═══════════════════════════════════════════════════════════
// STORY DATA
// ═══════════════════════════════════════════════════════════
const NODES = {

  // ── CHAPTER 1: CRASH ──────────────────────────────────────
  start: {
    chapter: 'Chapter 1 · The Crash',
    title: 'CRASH LANDING', emoji: '✈️',
    text: [
      'Your plane shudders violently. Through the cracked window you see it — a vast island of dense jungle rushing toward you at terrifying speed. The pilot\'s voice crackles and cuts out mid-sentence.',
      'BOOM.',
      'You open your eyes. Smoke rises from the twisted <span class="highlight">WRECKAGE</span> around you. Your ears ring. Through the shattered window, a white sandy beach glitters in the sunlight — and beyond it, a deep blue ocean stretches to the horizon.',
      'From the dark treeline behind you comes a sound. Deep. Rhythmic. Like something enormous breathing. Something that has smelled the smoke. Something that is coming to investigate.',
      'You have about sixty seconds. What do you do?',
    ],
    vocab: 'WRECKAGE',
    hpChange: -10,
    choices: [
      {
        text: '🔍 Search the wreckage for supplies first',
        spell: 'WRECKAGE',
        spellCtx: 'The twisted WRECKAGE might have useful supplies — but can you spell it?',
        successNode: 'wreckage_search',
        failNode:    'beach_arrive',
        failText:    'You hesitate too long and that breathing gets LOUDER — you bolt for the beach empty-handed!',
      },
      {
        text: '🏃 Sprint straight for the beach',
        spell: null, dice: true,
        diceGoodNode: 'beach_arrive', diceBadNode: 'beach_stumble',
        diceGoodText: 'You burst from the wreckage just as it erupts in flame behind you!',
        diceBadText:  'You trip on a piece of wing and go face-first into the sand.',
        diceBadHp: -5, successNode: 'beach_arrive',
      },
    ],
  },

  wreckage_search: {
    chapter: 'Chapter 1 · The Crash',
    title: 'GOOD THINKING!', emoji: '🎒',
    text: [
      'Covering your mouth against the smoke, you crawl through the twisted metal. Careful of the jagged edges.',
      'You find: a penknife 🔪, waterproof matches 🔥, a squashed protein bar 🍫, a plastic water bottle 💧, and — brilliantly — a torn but readable map of the island 🗺️.',
      'The breathing outside is louder now. Much louder. Time to run.',
    ],
    itemsGain: ['Penknife 🔪', 'Matches 🔥', 'Protein Bar 🍫', 'Water Bottle 💧', 'Island Map 🗺️'],
    scoreChange: 20,
    choices: [{ text: '🏃 Get to the beach — NOW', spell: null, successNode: 'beach_arrive' }],
  },

  beach_stumble: {
    chapter: 'Chapter 1 · The Crash',
    title: 'FACE FULL OF SAND', emoji: '😬',
    text: [
      'You spit out a mouthful of gritty sand and push yourself up. Behind you, the plane lets out a massive groan and something very large goes crashing through the treeline toward it.',
      'You are on the beach. You are alive. You are covered in sand. That\'s good enough for now.',
    ],
    hpChange: -5,
    choices: [{ text: '👀 Look around the beach', spell: null, successNode: 'beach_look' }],
  },

  beach_arrive: {
    chapter: 'Chapter 1 · The Crash',
    title: 'THE BEACH', emoji: '🏖️',
    text: [
      'You burst through the treeline onto a wide stretch of blindingly white sand. The ocean pounds the shore in long, rolling waves.',
      'Far out at sea, you spot something — a dark <span class="highlight">SILHOUETTE</span> against the glistening horizon. A boat? A ship? It\'s hard to tell from here.',
      'The beach stretches for miles in both directions. To your left, the coastline curves around to tall rocky cliffs. To your right, the beach narrows into a point with a dense cluster of palm trees.',
      'Behind you — still in the jungle — you hear it again. That breathing. And now: a deep, low rumble that vibrates in your chest.',
    ],
    vocab: 'SILHOUETTE',
    choices: [
      {
        text: '🚢 Signal the boat on the horizon',
        spell: 'SILHOUETTE',
        spellCtx: 'Identify the SILHOUETTE on the horizon — if you can spell it, you\'ll know exactly where to signal:',
        successNode: 'signal_good',
        failNode:    'signal_weak',
        failText:    'You wave randomly — the boat might have seen you. Or might not.',
      },
      {
        text: '🪨 Hide in the rocks along the cliff',
        spell: null, successNode: 'cliff_rocks',
      },

// ═══════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════
const G = {
  hp: 100, score: 0,
  items: [], node: 'start',
  wordsLearned: [],    // { word, def }
  wordsSpelled: [],    // word strings
  spellTries: 0,
};

// Pending spell data
let PS = {};

// ─── UI helpers ────────────────────────────────────────────
function $(id) { return document.getElementById(id); }

function updateHUD() {
  const hp = Math.max(0, G.hp);
  const pct = hp + '%';
  const bar = $('hp-bar');
  bar.style.width = pct;
  // Green → amber → red
  const h = Math.round(120 * (hp / 100)); // 120 = green, 0 = red
  bar.style.background = `hsl(${h},70%,40%)`;
  $('score-val').textContent = '⭐ ' + G.score;
}

function flash(text, type) {
  $('flash-text').textContent = text;
  $('flash-text').className = type;
  $('flash').classList.add('active');
  setTimeout(() => $('flash').classList.remove('active'), 1100);
}

// ─── MAIN NAVIGATION ───────────────────────────────────────
function go(nodeId) {
  const node = NODES[nodeId];
  if (!node) { console.error('Missing node:', nodeId); return; }
  G.node = nodeId;

  // Apply changes
  if (node.hpChange) {
    G.hp = Math.min(100, G.hp + node.hpChange);
    if (node.hpChange < 0) flash(node.hpChange + ' HP', 'bad');
    if (node.hpChange > 0) flash('+' + node.hpChange + ' HP!', 'ok');
  }
  if (node.scoreChange) G.score += node.scoreChange;
  if (node.itemsGain)   G.items.push(...node.itemsGain);

  // Vocab tracking
  if (node.vocab && !G.wordsLearned.find(w => w.word === node.vocab)) {
    const v = VOCAB[node.vocab];
    if (v) G.wordsLearned.push({ word: node.vocab, def: v.def });
  }

  // HP death check
  if (G.hp <= 0 && !node.isEnding) {
    G.hp = 0; updateHUD();
    go('end_eaten'); return;
  }

  updateHUD();
  if (node.chapter) $('chapter-display').textContent = node.chapter;

  if (node.isEnding) renderEnding(node);
  else               renderNode(node);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── NODE RENDERING ────────────────────────────────────────
function renderNode(node) {
  const paras = Array.isArray(node.text)
    ? node.text.map(t => `<p>${t}</p>`).join('')
    : `<p>${node.text}</p>`;

  const vocabBox = node.vocab && VOCAB[node.vocab] ? (() => {
    const v = VOCAB[node.vocab];
    return `<div class="vocab-box">
      <div class="vocab-word">📖 ${node.vocab}</div>
      <div class="vocab-def">${v.def}</div>
      <div class="vocab-example">"${v.ex}"</div>
    </div>`;
  })() : '';

  const itemBox = node.itemsGain ? `<div class="item-gain">
    <div class="item-gain-label">🎒 FOUND:</div>
    <div class="item-gain-list">${node.itemsGain.join(' &nbsp;·&nbsp; ')}</div>
  </div>` : '';

  const hpChip = node.hpChange
    ? `<span class="stat-chip ${node.hpChange < 0 ? 'chip-neg' : 'chip-pos'}">${node.hpChange > 0 ? '+' : ''}${node.hpChange} HP</span>`
    : '';

  const buttons = (node.choices || []).map((c, i) => {
    const cls = c.spell ? 'choice-spell' : 'choice-free';
    const badge = c.spell
      ? `<span class="badge">SPELL: ${c.spell}</span>`
      : `<span class="badge">FREE</span>`;
    return `<button class="${cls} choice-btn" onclick="handleChoice(${i})">${c.text}${badge}</button>`;
  }).join('');

  $('game-area').innerHTML = `
    <div class="scene-card">
      <div class="scene-header">
        <div class="scene-emoji">${node.emoji || '🌿'}</div>
        <div class="scene-title-wrap">
          <div class="scene-title">${node.title}${hpChip}</div>
          ${node.chapter ? `<div class="scene-chapter">${node.chapter}</div>` : ''}
        </div>
      </div>
      <div class="scene-body">${paras}${vocabBox}${itemBox}</div>
      ${buttons ? `<div class="choices-wrap"><div class="choices-label">What do you do?</div>${buttons}</div>` : ''}
    </div>`;
}

// ─── CHOICE HANDLER ────────────────────────────────────────
function handleChoice(i) {
  const choice = NODES[G.node].choices[i];
  if (choice.spell) openSpell(choice);
  else if (choice.dice) rollDice(choice);
  else go(choice.successNode);
}

// ─── SPELLING ──────────────────────────────────────────────
function openSpell(choice) {
  PS = { choice, tries: 0 };
  const v = VOCAB[choice.spell] || {};

  $('s-ctx').textContent  = choice.spellCtx || '';
  $('s-word').textContent = choice.spell;
  $('s-def').textContent  = '"' + (v.def || '') + '"';
  $('s-hint').textContent = hintText(choice.spell);
  $('s-hint').style.display = 'none';
  $('s-tries').textContent = '';
  $('s-result').className = 'spell-result';
  $('s-result').textContent = '';
  $('s-input').value = '';
  $('s-input').className = 'spell-input';
  $('s-skip').style.display = 'none';
  $('s-btn').textContent = 'SUBMIT ➤';
  $('s-btn').onclick = submitSpell;

  $('spell-overlay').classList.add('active');
  setTimeout(() => $('s-input').focus(), 120);
}

function hintText(word) {
  const blanks = word.split('').map((c, i) => i < 2 ? c : '_').join(' ');
  return `${word.length} letters · starts "${word.slice(0,2)}" · ${blanks}`;
}

function toggleHint() {
  const h = $('s-hint');
  h.style.display = h.style.display === 'none' ? 'block' : 'none';
}

function submitSpell() {
  const typed = $('s-input').value.trim().toUpperCase();
  const target = PS.choice.spell;
  const correct = typed === target;
  const inp = $('s-input');
  const res = $('s-result');

  if (correct) {
    inp.classList.add('correct');
    res.className = 'spell-result show ok';
    res.textContent = '✅ CORRECT! Brilliant spelling!';
    flash('CORRECT! +25', 'ok');
    G.score += 25;
    if (!G.wordsSpelled.includes(target)) G.wordsSpelled.push(target);
    if (!G.wordsLearned.find(w => w.word === target)) {
      const v = VOCAB[target];
      if (v) G.wordsLearned.push({ word: target, def: v.def });
    }
    updateHUD();
    $('s-btn').textContent = 'CONTINUE ➤';
    $('s-btn').onclick = () => {
      $('spell-overlay').classList.remove('active');
      const c = PS.choice;
      if (c.dice) rollDice({ ...c, successNode: c.successNode });
      else go(c.successNode);
    };
  } else {
    PS.tries++;
    inp.classList.add('wrong');
    res.className = 'spell-result show bad';

    const triesLeft = 3 - PS.tries;
    res.textContent = triesLeft > 0
      ? `❌ Not quite — ${triesLeft} tr${triesLeft === 1 ? 'y' : 'ies'} left! ${PS.choice.failText || ''}`
      : `❌ Not to worry — ${PS.choice.failText || 'you\'ll take the other path!'}`;

    $('s-tries').textContent = `Attempts: ${PS.tries}`;

    setTimeout(() => {
      inp.classList.remove('wrong');
      inp.value = '';
    }, 600);

    if (PS.tries >= 3) {
      $('s-btn').textContent = 'CONTINUE →';
      $('s-btn').onclick = skipSpell;
      $('s-skip').style.display = 'none';
    } else if (PS.tries >= 1) {
      $('s-skip').style.display = 'block';
    }
  }
}

function skipSpell() {
  $('spell-overlay').classList.remove('active');
  const old = document.getElementById('give-up-extra');
  if (old) old.remove();
  go(PS.choice.failNode);
}

// ─── DICE ──────────────────────────────────────────────────
const FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];

function rollDice(choice) {
  $('dice-overlay').classList.add('active');
  const face = $('dice-face');
  const msg  = $('dice-msg');
  face.style.animation = 'none';
  face.offsetHeight;
  face.style.animation = '';

  let t = 0;
  const iv = setInterval(() => {
    face.textContent = FACES[Math.floor(Math.random() * 6)];
    if (++t > 18) {
      clearInterval(iv);
      const roll = Math.floor(Math.random() * 6) + 1;
      face.textContent = FACES[roll - 1];
      const good = roll >= 4;
      if (good) {
        msg.style.color = '#69f0ae';
        msg.textContent = `🎲 You rolled ${roll}! ${choice.diceGoodText || 'Nice!'}`;
        $('dice-cont').onclick = () => { $('dice-overlay').classList.remove('active'); go(choice.diceGoodNode || choice.successNode); };
      } else {
        if (choice.diceBadHp) { G.hp = Math.max(0, G.hp + choice.diceBadHp); updateHUD(); }
        msg.style.color = '#ff5252';
        msg.textContent = `🎲 You rolled ${roll}... ${choice.diceBadText || 'Bad luck!'}`;
        $('dice-cont').onclick = () => { $('dice-overlay').classList.remove('active'); go(choice.diceBadNode || choice.successNode); };
      }
    }
  }, 75);
}

// ─── ENDINGS ───────────────────────────────────────────────
function renderEnding(node) {
  G.score += (node.scoreBonus || 0);
  updateHUD();

  const paras = node.text.split('\n\n').filter(Boolean).map(p => `<p>${p}</p>`).join('');

  const wordsPanel = G.wordsLearned.length > 0 ? `
    <div class="words-panel">
      <h3>📚 WORDS YOU ENCOUNTERED</h3>
      ${G.wordsLearned.map(w => `
        <div class="word-row">
          <span class="wr-word">${w.word}</span>
          <span class="wr-def">${w.def}</span>
        </div>`).join('')}
    </div>` : '';

  const spelledLine = G.wordsSpelled.length > 0 ? `
    <div class="spelled-line">
      ✅ Correctly spelled: <strong>${G.wordsSpelled.join(', ')}</strong>
    </div>` : '';

  $('game-area').innerHTML = `
    <div class="scene-card">
      <div class="scene-body">
        <div class="ending-wrap">
          <div class="ending-big-emoji">${node.emoji}</div>
          <div class="ending-title ${node.type}">${node.title}</div>
          <div class="ending-body">${paras}</div>
          <div class="final-score">FINAL SCORE: ${G.score} ⭐</div>
          ${spelledLine}
          ${wordsPanel}
          <button class="restart-btn" onclick="restart()">🔄 PLAY AGAIN!</button>
        </div>
      </div>
    </div>`;
}

// ─── RESTART ───────────────────────────────────────────────
function restart() {
  G.hp = 100; G.score = 0; G.items = []; G.node = 'start';
  G.wordsLearned = []; G.wordsSpelled = []; G.spellTries = 0;
  $('spell-overlay').classList.remove('active');
  $('dice-overlay').classList.remove('active');
  updateHUD();
  go('start');
}

// ─── KEYBOARD ──────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ($('spell-overlay').classList.contains('active') && e.key === 'Enter') {
    submitSpell();
  }
});

// ─── BOOT ──────────────────────────────────────────────────
updateHUD();
go('start');
</script>
</body>
</html>
