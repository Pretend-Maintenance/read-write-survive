eu_spain_clue:{chapter:'Chapter 2 · Barcelona, Spain 🇪🇸',title:'THE SECOND CLUE',emoji:'📜',text:['The clue reads: "Next: the city where ancient ruins and <span class="highlight">RENAISSANCE</span> art exist in the same street. Find the small square near the oldest fountain, and look for the name carved into the base."','Renaissance. That word means "rebirth" in French — a period when art and ideas exploded across Europe in the 1400s and 1500s. Rome is full of it.','The city must be Rome.','Before you leave, you want to say thank you to the helpful market stall owner who pointed you toward the compartment.'],vocab:'RENAISSANCE',choices:[{text:'✈️ Head to Rome',spell:'GRACIAS',spellCtx:'Say GRACIAS — thank you in Spanish — before you go. Spell it:',successNode:'eu_rome',failNode:'eu_rome',failText:'You forget the word and mime "thank you" awkwardly instead.'}]},
eu_rome:{chapter:'Chapter 3 · Rome, Italy 🇮🇹',title:'ROME, ITALY',emoji:'🏛️',text:['Rome is overwhelming in the best possible way. Ancient ruins — the Colosseum, the Roman Forum — sit in the middle of a living, breathing modern city. You can eat pizza in the shadow of a 2,000-year-old temple.','A gelato seller waves: "<span class="highlight">CIAO</span>!" That\'s Italian — it means both "hello" AND "goodbye". Incredibly efficient.','Your clue mentioned a small square near the oldest fountain. Rome has hundreds of fountains. But "oldest" narrows it down significantly.'],vocab:'CIAO',choices:[{text:'🍦 Say CIAO and ask for directions',spell:'CIAO',spellCtx:'Greet the gelato seller — say CIAO! Spell it:',successNode:'eu_rome_local',failNode:'eu_rome_alone',failText:'You nod quietly. The seller shrugs and goes back to serving gelato.'},{text:'🗺️ Find the square using your map',spell:null,successNode:'eu_rome_alone'}]},
eu_rome_local:{chapter:'Chapter 3 · Rome, Italy 🇮🇹',title:'CIAO!',emoji:'🤌',text:['The gelato seller grins and hands you a free scoop (pistachio — excellent choice). She knows exactly which square you mean.','Twenty minutes later you\'re standing next to Rome\'s oldest fountain. The base has names carved into it — centuries of them. Tourists. Artists. And one very recent carving, fresh and pale against the ancient stone: a letter G.','G for the thief. They were here.'],scoreChange:25,choices:[{text:'🔍 Look more carefully at the fountain base',spell:null,successNode:'eu_rome_clue'}]},
eu_rome_alone:{chapter:'Chapter 3 · Rome, Italy 🇮🇹',title:'EXPLORING ROME',emoji:'🗺️',text:['After asking three people using only mime and pointing, you locate the oldest fountain. It takes longer than it should have.','The base is carved with names — and a fresh pale carving: just the letter G.'],hpChange:-5,choices:[{text:'🔍 Examine the carving',spell:null,successNode:'eu_rome_clue'}]},
eu_rome_clue:{chapter:'Chapter 3 · Rome, Italy 🇮🇹',title:'THE THIRD CLUE',emoji:'📜',text:['Behind a loose stone near the G carving, a folded note. It reads: "Final location: find the city with the greatest <span class="highlight">HERITAGE</span> of music and engineering in Europe. Look for the monument that points east, in the old quarter."','Heritage — the traditions and history passed down through generations. Germany is famous for both music (Beethoven, Bach) and engineering (cars, bridges, cameras).','Berlin. The monument must be in Berlin.','The gelato seller who helped you calls across the square: "BELLISSIMO!" — Most beautiful! — pointing at the old fountain in the evening light. You\'ve learned another Italian word.'],vocab:'HERITAGE',choices:[{text:'✈️ Fly to Berlin',spell:'BELLISSIMO',spellCtx:'Repeat BELLISSIMO — the Italian word for magnificent! Spell it:',successNode:'eu_germany',failNode:'eu_germany',failText:'You wave anyway. The gelato seller approves of the effort.'}]},
eu_germany:{chapter:'Chapter 4 · Berlin, Germany 🇩🇪',title:'BERLIN, GERMANY',emoji:'🏰',text:['Berlin is vast and serious and fascinating. The Brandenburg Gate stands at one end of a long boulevard — a massive stone <span class="highlight">MONUMENT</span> built in the 1700s, facing east.','This is it. The monument that points east.','A local historian who overheard you asking for directions helps immediately. "The old quarter is just here," she says, pointing. As she leaves you say: "<span class="highlight">DANKE</span>!" — and she turns back, delighted.'],vocab:'DANKE',choices:[{text:'🔍 Search the old quarter',spell:'DANKE',spellCtx:'Say DANKE — thank you in German — properly. Spell it:',successNode:'eu_germany_local',failNode:'eu_germany_alone',failText:'You forget and say "thanks" in English instead. She\'s still pleased.'},{text:'🏛️ Head straight to the Brandenburg Gate',spell:null,successNode:'eu_germany_alone'}]},
eu_germany_local:{chapter:'Chapter 4 · Berlin, Germany 🇩🇪',title:'DANKE!',emoji:'😊',text:['The historian beams. She insists on accompanying you — she knows every stone of the old quarter.','Within thirty minutes she points to a small courtyard behind a centuries-old building. "That fountain," she says, "has a false base. We always wondered who put it there."','You look at each other.'],scoreChange:25,choices:[{text:'🔍 Examine the fountain',spell:null,successNode:'eu_discovery'}]},
eu_germany_alone:{chapter:'Chapter 4 · Berlin, Germany 🇩🇪',title:'SEARCHING BERLIN',emoji:'🔍',text:['The old quarter is a maze of narrow streets and beautifully restored old buildings. After an hour, you find a small courtyard with an old fountain.','Something about the base looks wrong. Too clean. Too recent.'],hpChange:-5,choices:[{text:'🔍 Look more closely',spell:null,successNode:'eu_discovery'}]},
eu_discovery:{chapter:'Chapter 5 · The Final Reveal',title:'THE DISCOVERY',emoji:'🎨',text:['The false base of the fountain unscrews. Inside: a long waterproof tube.','You open it with trembling hands.','The Jade Serpent. Rolled carefully, unharmed. The thief — whoever G is — hid it here but hadn\'t collected it yet.','You\'ve found it.','The German historian says: "<span class="highlight">WUNDERBAR</span>!" That means wonderful. Right now it feels like the most accurate word in any language.'],vocab:'WUNDERBAR',choices:[{text:'📞 Call the authorities',spell:'WUNDERBAR',spellCtx:'Spell WUNDERBAR — the German word for wonderful — to celebrate!',successNode:'end_eu_triumph',failNode:'end_eu_good',failText:'You fumble it — but who cares? You found the painting!'}]},
end_eu_triumph:{isEnding:true,type:'good',title:'MASTERPIECE RECOVERED!',emoji:'🎨',text:`The painting is returned to the Louvre within 24 hours. The French Minister of Culture calls it "an extraordinary act of international detective work."

There is a small ceremony. Representatives from France, Spain, Italy and Germany attend — the four countries you visited. You stand there thinking about cobblestones and Renaissance art and ancient monuments and everything you learned along the way.

"How did you do it?" a journalist asks.

"I learned to say hello," you say. "In every language I could. BONJOUR. HOLA. CIAO. DANKE. People help you when you try to speak their language. And when people help you, you can do anything."

The journalist writes it all down.

It becomes a very famous quote.

You didn't just find a painting. You found out that words — in any language — are the most powerful tools in the world.`,scoreBonus:100},
end_eu_good:{isEnding:true,type:'good',title:'PAINTING FOUND!',emoji:'🎨',text:`The Jade Serpent is safe. The authorities catch the thief — a collector named Gregor, hence the G — at the Berlin airport three hours later.

At the Louvre celebration that evening, you stand in front of the rehung painting thinking about everything — the cobblestone streets of Paris, the magnificent cathedral in Barcelona, the ancient ruins of Rome, the Brandenburg Gate in Berlin.

Four countries. Four languages. One adventure.

You didn't just chase a stolen painting across Europe. You learned that every place has its own words, its own history, its own way of saying hello. And if you know enough words — in enough languages — there's nowhere in the world you can't go.

Where next?`,scoreBonus:80},
end_eu_lost:{isEnding:true,type:'bad',title:'STILL IN PARIS...',emoji:'🥐',text:`You are still in Paris.

This is not entirely bad news. Paris is magnificent.

You have eaten three croissants, visited a very good cheese shop, stood on the Eiffel Tower twice, and learned to say BONJOUR to virtually everyone you meet. They all respond very warmly.

The painting is still missing. You have not found any clues. A pigeon has stolen your map.

On the plus side, your French pronunciation has improved considerably and the baker who said BONJOUR to you on the first day has become a friend and teaches you a new word every morning.

MAGNIFIQUE, you say, about the croissants.

She agrees. She's right. They are.

Press RESTART and this time — follow the clues rather than the cheese.`,scoreBonus:0}}},
arctic:{id:'arctic',title:'Arctic Survival Zero',emoji:'🧊',color:'#00bcd4',desc:'Stranded on the Arctic ice after a blizzard. Survive polar bears, frozen rivers and the Northern Lights.',tag:'Survival · Science',startNode:'arctic_start',
nodes:{
arctic_start:{chapter:'Chapter 1 · The Research Station',title:'POLAR RESEARCH STATION',emoji:'🏔️',text:['The Arctic research station sits on the tundra like a tiny red dot in an ocean of white. You\'ve been here two weeks helping the scientists collect climate data — measuring ice thickness, tracking wildlife, recording snowfall.','The radio crackles. The weather team in Oslo is warning of a severe <span class="highlight">BLIZZARD</span> heading this way. Winds over 100 kilometres per hour. Near-zero visibility. Estimated arrival: ninety minutes.','Dr Kowalski hands out emergency bags. "Everyone knows the drill," she says. "Nobody goes outside once it hits."','You glance at the weather instruments outside. One hasn\'t been brought in yet.'],vocab:'BLIZZARD',choices:[{text:'🎒 Prepare your emergency pack carefully',spell:'BLIZZARD',spellCtx:'Understand what\'s coming — spell BLIZZARD:',successNode:'arctic_prepared',failNode:'arctic_blizzard_hits',failText:'You rush to prepare but skip a few important items.'},{text:'🌡️ Run out to grab the weather instrument first',spell:null,successNode:'arctic_venture'}]},
arctic_prepared:{chapter:'Chapter 1 · The Research Station',title:'READY FOR ANYTHING',emoji:'🎒',text:['You pack methodically: thermal layers, emergency foil blanket, high-calorie ration bars, a hand-crank torch, a whistle, a compass, and a small first aid kit.','Dr Kowalski nods approvingly. "That\'s how it\'s done."','Then the lights flicker. The wind hits the walls like a freight train. The blizzard arrives forty minutes early.'],itemsGain:['Thermal Layers 🧥','Foil Blanket 🪙','Ration Bars 🍫','Hand Torch 🔦','Compass 🧭'],scoreChange:20,choices:[{text:'❄️ The blizzard is here — what happened to the station?',spell:null,successNode:'arctic_blizzard_hits'}]},
arctic_venture:{chapter:'Chapter 1 · The Research Station',title:'OUTSIDE!',emoji:'❄️',text:['You grab the instrument and start back — but the wind has already picked up dramatically. By the time you turn around, the station has vanished in a wall of white.','A blizzard in the Arctic isn\'t like a blizzard anywhere else. The temperature drops to minus thirty. The wind makes it feel like minus fifty. Without shelter, you have minutes before hypothermia becomes a serious risk.','You need to find the station. Or build shelter. NOW.'],hpChange:-10,choices:[{text:'🏠 Try to find the station in the whiteout',spell:null,successNode:'arctic_blizzard_hits'}]},
arctic_blizzard_hits:{chapter:'Chapter 1 · The Research Station',title:'WHITEOUT',emoji:'🌨️',text:['The world turns completely white.','You can\'t see your hand in front of your face. The wind is so loud you can\'t hear yourself shout. The cold hits every centimetre of exposed skin like needles.','<span class="highlight">HYPOTHERMIA</span> — the dangerous condition where your body loses heat faster than it can produce it — becomes a real threat within minutes out here. Your core temperature is already dropping.','You stumble and fall. When you look up, you have no idea which direction the station is. But you see — just barely — the dark shadow of a snowbank nearby. Big enough to shelter behind.'],vocab:'HYPOTHERMIA',choices:[{text:'🏔️ Dig into the snowbank — build a snow shelter',spell:'HYPOTHERMIA',spellCtx:'You need to prevent HYPOTHERMIA — spell it to focus your survival brain:',successNode:'arctic_smart_shelter',failNode:'arctic_basic_shelter',failText:'You crouch behind the snowbank without digging in — better than nothing.'},{text:'🧭 Try to navigate back using your compass',spell:null,dice:true,diceGoodNode:'arctic_smart_shelter',diceBadNode:'arctic_basic_shelter',diceGoodText:'Your compass reading is perfect — you find the snowbank AND manage to dig in!',diceBadText:'The compass helps a little but you\'re too cold to dig properly.',diceBadHp:-15,successNode:'arctic_basic_shelter'}]},
arctic_smart_shelter:{chapter:'Chapter 2 · Night on the Ice',title:'QUINZHEE SHELTER',emoji:'🏠',text:['You remember what Dr Kowalski taught you: a quinzhee. Pile snow into a mound, let it sinter (harden) for an hour, then hollow it out. The snow itself insulates you.','Except you don\'t have an hour. So you dig as fast as your numb fingers will allow, carving a hollow in the existing snowbank, and squeeze inside.','It works. The howling reduces to a muffled roar. Your body heat begins, slowly, to warm the tiny space.','You\'re safe. For now.'],hpChange:10,scoreChange:25,choices:[{text:'🌙 Wait out the storm',spell:null,successNode:'arctic_night'}]},
arctic_basic_shelter:{chapter:'Chapter 2 · Night on the Ice',title:'CROUCHING BEHIND THE SNOW',emoji:'🌨️',text:['You huddle behind the snowbank, wrapped in everything you have. It\'s not ideal — the wind finds every gap — but it\'s survival.','Hours pass. The blizzard howls. You do not sleep but you stay conscious, which is the important thing.','Eventually, the wind drops. The roaring fades. The world goes from white to a deep, startling, crystalline black.'],hpChange:-10,choices:[{text:'👀 Look up',spell:null,successNode:'arctic_night'}]},
arctic_night:{chapter:'Chapter 2 · Night on the Ice',title:'THE NORTHERN LIGHTS',emoji:'🌌',text:['The storm has passed. And above you — above the flat, silent, endless <span class="highlight">TUNDRA</span> — the sky is doing something impossible.','The AURORA BOREALIS. Curtains of green and purple light ripple across the darkness like something alive, like the sky itself is breathing. Blues and pinks shimmer at the edges.','You\'ve never seen anything so beautiful in your life.','Then, at the edge of your torchlight: two bright eyes. Small. Low to the ground. A white arctic fox, sitting and watching you with complete composure.'],vocab:'TUNDRA',choices:[{text:'🦊 Follow the arctic fox',spell:'AURORA',spellCtx:'The AURORA lights your way — spell it to name this incredible sight:',successNode:'arctic_fox_follows',failNode:'arctic_fox_watch',failText:'You can\'t find the word but follow the fox anyway.'},{text:'🔦 Search for the station with your torch',spell:null,successNode:'arctic_fox_watch'}]},
arctic_fox_follows:{chapter:'Chapter 2 · Night on the Ice',title:'THE FOX KNOWS',emoji:'🦊',text:['The fox trots a few metres, looks back at you, trots a few more, looks back again.','You follow. Across the glittering tundra, under the aurora, the fox leads you on a winding route around what turns out to be a dangerous thin-ice zone you\'d have walked straight into.','After forty minutes, a red shape materialises in the torchlight. The research station.','The fox sits down, watches you reach the door, and then turns and disappears into the night.'],scoreChange:35,hpChange:15,choices:[{text:'🏠 The station!',spell:null,successNode:'arctic_station_return'}]},
arctic_fox_watch:{chapter:'Chapter 2 · Night on the Ice',title:'ALONE ON THE ICE',emoji:'❄️',text:['You search for two hours with the torch, sweeping the beam in arcs. The aurora above is extraordinary — but you\'re too cold to appreciate it properly.','Then the beam catches something red in the distance. The station.'],hpChange:-10,choices:[{text:'🏠 Run for the station!',spell:null,successNode:'arctic_station_return'}]},
arctic_station_return:{chapter:'Chapter 3 · The Morning After',title:'BACK AT THE STATION',emoji:'🏠',text:['The door opens and warmth rushes over you like a wall. Dr Kowalski grabs you by both shoulders.','The station\'s heating has failed. A <span class="highlight">GLACIER</span> — a slow-moving river of ice — shifted during the storm and severed the fuel line. The station is getting colder by the hour.','"We need to reach the emergency fuel depot," Dr Kowalski says. "It\'s three kilometres south, on the far side of the ice field."','She pulls up a satellite map. "The quickest route crosses the glacier. But there are crevasses."'],vocab:'GLACIER',choices:[{text:'🧊 Cross the glacier directly',spell:'GLACIER',spellCtx:'A GLACIER is a slow-moving river of ice — dangerous to cross. Spell it:',successNode:'arctic_glacier_safe',failNode:'arctic_glacier_crack',failText:'You step onto the glacier without checking the ice first!'},{text:'🔄 Go around the glacier — longer but safer',spell:null,dice:true,diceGoodNode:'arctic_fuel_found',diceBadNode:'arctic_glacier_crack',diceGoodText:'The long way round is slow but you find the depot without incident.',diceBadText:'Going around, you hit a snowfield that hides a crevasse anyway!',diceBadHp:-15,successNode:'arctic_fuel_found'}]},
arctic_glacier_safe:{chapter:'Chapter 3 · The Ice Field',title:'CROSSING THE GLACIER',emoji:'🧊',text:['You test every step before your full weight goes on it. Tap with the ice pole. Listen for the hollow sound of a crevasse below.','The <span class="highlight">CRYSTALLINE</span> ice catches your torchlight and scatters it in blue and white sparks. It\'s beautiful and terrifying at the same time.','Halfway across, you hear a deep CRACK from somewhere below. You stand perfectly still and wait.','The ice holds.','An hour later you reach the far side. The fuel depot is fifty metres away.'],vocab:'CRYSTALLINE',scoreChange:30,choices:[{text:'⛽ Get to the fuel depot',spell:null,successNode:'arctic_fuel_found'}]},
arctic_glacier_crack:{chapter:'Chapter 3 · The Ice Field',title:'CRACK!',emoji:'💥',text:['The ice surface gives without warning. You drop — half a metre, one leg plunging through into a crevasse before you throw yourself sideways and your arms catch the edge.','Your heart hammers so hard it seems to shake your whole body.','You haul yourself out and lie flat on the ice, spreading your weight, and crawl the rest of the way on your stomach.','Not the plan. But you make it to the far side.'],hpChange:-20,choices:[{text:'⛽ Reach the fuel depot',spell:null,successNode:'arctic_fuel_found'}]},
arctic_fuel_found:{chapter:'Chapter 4 · The Rescue',title:'FUEL FOUND!',emoji:'⛽',text:['The emergency fuel depot is a small red hut. Inside: fuel canisters, spare rations, a first aid kit, and a working radio.','You get on the radio immediately.','The rescue team at Longyearbyen has been trying to reach the station for six hours. They\'re launching a snowmobile rescue team and a helicopter. ETA: two hours.','Dr Kowalski\'s voice comes through the station radio when you relay this. There\'s a long silence. Then: "Well done. Very well done indeed."','You have two hours. The aurora is out again.'],scoreChange:40,choices:[{text:'🚁 Wait for rescue — and watch the lights',spell:'EXPEDITION',spellCtx:'Every great EXPEDITION has a moment like this — spell it:',successNode:'end_arctic_helicopter',failNode:'end_arctic_snowmobile',failText:'You fumble the word but the rescue comes anyway.'}]},
end_arctic_helicopter:{isEnding:true,type:'good',title:'AIRLIFTED TO SAFETY!',emoji:'🚁',text:`The helicopter sets down in a wash of rotor noise and snow. The rescue medic checks you over and wraps you in a thermal blanket that feels like being hugged by a radiator.

"How long were you out in that?" she asks.

"Long enough," you say.

On the flight back, Dr Kowalski sits beside you looking out at the tundra below — the glacier, the aurora, the endless white.

"You know," she says, "most people who come to the Arctic are here to see the landscape. They look at it. You survived it." She pauses. "That's different."

You think about hypothermia and insulation and the crystalline ice and the luminous aurora. About the words that gave you the knowledge to act correctly.

About an arctic fox with bright eyes, sitting in the snow, deciding you were worth saving.

The world, you think, is full of extraordinary things. You just have to know the words for them.`,scoreBonus:100},
end_arctic_snowmobile:{isEnding:true,type:'good',title:'SNOWMOBILE RESCUE!',emoji:'🛷',text:`The snowmobiles arrive with a roar of engines and a spray of snow. The rescue team chief shakes your hand very firmly.

"The radio call saved everyone," he says simply. "Without that we'd have been searching for days."

Back at the warm base in Longyearbyen, wrapped in blankets and eating the best hot chocolate of your life, you write up what happened in your notebook.

Blizzard. Hypothermia. Quinzhee shelter. The tundra. The aurora. The crystalline glacier. The expedition.

Every word you learned tonight was a survival tool. Every definition you understood helped you make the right decision at the right moment.

The arctic fox doesn't get a mention in the official report. Some things belong only to the ice.`,scoreBonus:80},
end_arctic_frozen:{isEnding:true,type:'bad',title:'STILL A BIT FROZEN.',emoji:'🥶',text:`You are still on the tundra.

In your defence, the blizzard was very large and the tundra is very flat and everything looks exactly the same in every direction.

You have built a reasonable snow shelter. You have eaten all your ration bars. You have watched the aurora borealis for so long you have started to feel personally acquainted with it.

The arctic fox has been sitting nearby for some hours now. It appears to be judging you.

"I know," you tell it. It flicks an ear.

On the positive side, your knowledge of Arctic survival has improved dramatically over the past twelve hours. You know what hypothermia feels like (not great). You know what crystalline ice sounds like when it cracks (terrifying). You know that permafrost smells like ancient dust when you disturb it.

Next time, follow the fox immediately.

Press RESTART — and trust the fox.`,scoreBonus:0}}},
amazon:{id:'amazon',title:'Lost in the Amazon',emoji:'🌿',color:'#66bb6a',desc:'Follow a lost explorer\'s journal deep into the Amazon rainforest — wildlife, ancient temples and river crossings.',tag:'Wildlife · Adventure',startNode:'amazon_start',
nodes:{
amazon_start:{chapter:'Chapter 1 · The River',title:'THE AMAZON RIVER',emoji:'🛶',text:['The river is impossibly wide — brown and powerful and carrying whole trees in its current. Your riverboat chugs upstream through the morning mist as birds with improbable colours dart between the trees.','You have the journal of Explorer Dr Eduardo Santos, who disappeared into the Amazon six weeks ago following a lead about an ancient temple. His last GPS coordinates put him somewhere up a smaller branch of the river — a <span class="highlight">TRIBUTARY</span>.','Your guide, Valentina, cuts the engine. "Here," she says. "We go by canoe from here. The tributary is too narrow for the boat."','The jungle stretches in every direction. It looks like it goes on forever. Because it basically does.'],vocab:'TRIBUTARY',choices:[{text:'🗺️ Study the journal carefully before setting off',spell:'TRIBUTARY',spellCtx:'Identify the TRIBUTARY you\'re looking for — spell the word:',successNode:'amazon_journal_studied',failNode:'amazon_journal_skimmed',failText:'You skim it quickly and miss some important details.'},{text:'🛶 Get in the canoe and go',spell:null,successNode:'amazon_journal_skimmed'}]},
amazon_journal_studied:{chapter:'Chapter 1 · The River',title:'JOURNAL STUDIED',emoji:'📓',text:['The journal is extraordinary. Dr Santos writes beautifully about the Amazon — the extraordinary <span class="highlight">BIODIVERSITY</span>, the plants and animals found nowhere else on Earth.','More importantly, you find a hand-drawn map tucked inside the back cover. It shows the tributary, three landmarks, and an X marked "Temple of the Green Serpent."','You have the map. You have the landmarks. You have Valentina.','Let\'s go find Dr Santos.'],vocab:'BIODIVERSITY',itemsGain:['Journal 📓','Santos\'s Map 🗺️'],scoreChange:20,choices:[{text:'🛶 Into the tributary',spell:null,successNode:'amazon_canopy'}]},
amazon_journal_skimmed:{chapter:'Chapter 1 · The River',title:'INTO THE UNKNOWN',emoji:'🛶',text:['The canoe slips into the tributary and the jungle closes overhead immediately. The sounds change — a wall of noise: insects, frogs, birds, running water.','Valentina paddled these waterways as a child. She navigates without hesitation.','You have Dr Santos\'s journal but you didn\'t study it closely. You hope that\'s not going to matter.'],choices:[{text:'🌿 Continue up the tributary',spell:null,successNode:'amazon_canopy'}]},
amazon_canopy:{chapter:'Chapter 2 · The Jungle Floor',title:'UNDER THE CANOPY',emoji:'🌿',text:['You beach the canoe and enter the jungle on foot. The <span class="highlight">CANOPY</span> overhead is so thick it blocks most of the sky — the light that reaches you is green and dim, filtered through twenty metres of leaves.','Strange sounds come from above. A monkey watches you with enormous eyes from a branch. Somewhere close, something crashes through the undergrowth.','Valentina holds up a hand. She\'s looking at the river.','Between you and the path ahead: a wide, slow-looking stretch of water. Dark. Still.','Valentina says one word: "Piranhas."'],vocab:'CANOPY',choices:[{text:'🪵 Build a crossing using a fallen branch',spell:'PIRANHA',spellCtx:'Name the PIRANHA — the river\'s razor-toothed danger — and spell it correctly:',successNode:'amazon_careful_cross',failNode:'amazon_splash_cross',failText:'You forget the word and wade in a little before Valentina grabs your arm!'},{text:'🌉 Find the narrowest point and jump',spell:null,dice:true,diceGoodNode:'amazon_careful_cross',diceBadNode:'amazon_splash_cross',diceGoodText:'You make it across in one leap — impressive!',diceBadText:'You land short and splash in up to your knee. Valentina hauls you out FAST.',diceBadHp:-10,successNode:'amazon_careful_cross'}]},
amazon_careful_cross:{chapter:'Chapter 2 · The Jungle Floor',title:'RIVER CROSSED',emoji:'✅',text:['You use a long fallen branch as a bridge, testing its strength before committing. Valentina goes first. Then you.','On the far bank, you look back at the still, dark water. A ripple moves across the surface. Then another.','"Piranhas," Valentina confirms, and walks on without looking back. She is very calm.','You follow. Also calm. Mostly.'],scoreChange:20,choices:[{text:'🌿 Continue toward the village',spell:null,successNode:'amazon_village'}]},
amazon_splash_cross:{chapter:'Chapter 2 · The Jungle Floor',title:'TOO CLOSE!',emoji:'💦',text:['The water is ankle-deep when you feel something brush your foot. Valentina yanks you backward with surprising strength and you crash onto the bank.','A ripple. Then lots of ripples. The piranhas investigate the disturbance.','You cross further upstream where there\'s a fallen log. Slower. Drier. Much more sensible.'],hpChange:-10,choices:[{text:'🌿 Continue more carefully',spell:null,successNode:'amazon_village'}]},
amazon_village:{chapter:'Chapter 2 · The Village',title:'THE INDIGENOUS VILLAGE',emoji:'🏘️',text:['The village appears without warning — a clearing in the jungle containing a dozen round thatched houses, a central fire, gardens of plants you\'ve never seen before, and twenty people who are looking at you with understandable curiosity.','These are <span class="highlight">INDIGENOUS</span> people — communities whose ancestors have lived in this forest for thousands of years and know it better than any outsider ever could.','Valentina speaks quietly in the village\'s language. You wait. After a long moment, an elder nods.','She turns to you. "Be respectful. Be quiet. And for goodness\' sake, don\'t touch anything without asking."'],vocab:'INDIGENOUS',choices:[{text:'🤝 Show respect — follow their lead',spell:'INDIGENOUS',spellCtx:'These INDIGENOUS people know this forest far better than you. Spell it to honour that:',successNode:'amazon_village_welcome',failNode:'amazon_village_uncertain',failText:'You try but seem nervous. The elder studies you carefully before deciding to help.'},{text:'❓ Ask immediately about Dr Santos',spell:null,successNode:'amazon_village_uncertain'}]},
amazon_village_welcome:{chapter:'Chapter 2 · The Village',title:'WELCOMED',emoji:'🤝',text:['The elder — whose name, Valentina translates, means "She who remembers the forest" — leads you to a seat by the fire and serves you a drink made from forest plants. It tastes extraordinary.','She speaks at length. Valentina translates:','"She says the explorer passed through here. He was kind and asked before taking photographs. They showed him the path to the temple. She will show you the same path."','She adds: "She says the temple is NOCTURNAL — active at night. You should arrive before dusk."'],scoreChange:35,itemsGain:['Village Path Map 🗺️','Forest Medicine 🌿'],choices:[{text:'🌿 Follow the elder\'s path',spell:null,successNode:'amazon_deep'}]},
amazon_village_uncertain:{chapter:'Chapter 2 · The Village',title:'UNCERTAIN WELCOME',emoji:'😐',text:['The elder agrees to let you pass, but offers no guide. "The explorer went east," Valentina translates. "Beyond the kapok trees."','You thank them and move on. East it is.'],hpChange:-5,choices:[{text:'🌿 Head east',spell:null,successNode:'amazon_deep'}]},
amazon_deep:{chapter:'Chapter 3 · Deep Forest',title:'NIGHT IN THE FOREST',emoji:'🌙',text:['The forest changes as the afternoon fades. The sounds shift — the day birds go quiet and the <span class="highlight">NOCTURNAL</span> creatures begin to wake. Frogs call from every direction. Something large moves through the canopy overhead.','Then Valentina freezes.','Across the path, looped over a root in a casual figure-of-eight, is an anaconda. The world\'s heaviest snake. This one is easily five metres long, as thick as your thigh, with scales the colour of the jungle floor.','It\'s not threatening you. It\'s just there. In the way.'],vocab:'NOCTURNAL',choices:[{text:'⏳ Wait patiently and still for it to move',spell:'ANACONDA',spellCtx:'Name this giant snake — spell ANACONDA to show you know what you\'re dealing with:',successNode:'amazon_anaconda_respect',failNode:'amazon_anaconda_detour',failText:'Valentina pulls you sideways onto a different path.'},{text:'🔄 Find a way around it',spell:null,successNode:'amazon_anaconda_detour'}]},
amazon_anaconda_respect:{chapter:'Chapter 3 · Deep Forest',title:'THE ANACONDA MOVES',emoji:'🐍',text:['You wait. Valentina waits. Neither of you speaks or moves for eleven very long minutes.','The anaconda slowly lifts its head, tastes the air, and then — with a remarkable grace for something so enormous — slides off the root and into the river that runs beside the path. Within seconds it\'s gone.','"They\'re not aggressive," Valentina says quietly. "They just need to be respected. Like everything in the Amazon."','The temple is visible through the trees ahead.'],scoreChange:25,choices:[{text:'🏛️ Approach the temple',spell:null,successNode:'amazon_temple'}]},
amazon_anaconda_detour:{chapter:'Chapter 3 · Deep Forest',title:'DETOUR THROUGH THE FERNS',emoji:'🌿',text:['You push through a wall of ferns on a parallel path. It adds thirty minutes and you get very muddy. But you arrive at the temple without disturbing the anaconda, which is probably better for everyone.'],hpChange:-5,choices:[{text:'🏛️ Approach the temple',spell:null,successNode:'amazon_temple'}]},
amazon_temple:{chapter:'Chapter 4 · The Temple',title:'THE TEMPLE OF THE GREEN SERPENT',emoji:'🏛️',text:['The temple rises from the jungle like a natural feature — moss-covered stone steps leading to carved columns half-eaten by roots and vines. Trees grow through the structure itself, their roots splitting the ancient stones.','The <span class="highlight">BIODIVERSITY</span> around the temple is extraordinary — butterflies the size of your hand, a troupe of howler monkeys on the roof, flowers that seem to glow in the fading light.','From inside the temple: a light. A headtorch.','A voice calls out: "Valentina? Is that you?"','Dr Santos. Found.'],vocab:'BIODIVERSITY',scoreChange:30,choices:[{text:'🏃 Rush inside',spell:null,successNode:'amazon_temple_inside'},{text:'🤫 Approach carefully — you don\'t know what else might be in there',spell:'PHOTOSYNTHESIS',spellCtx:'Plants survive in this dark temple through PHOTOSYNTHESIS — light into food. Spell it to show your science knowledge:',successNode:'amazon_temple_inside_safe',failNode:'amazon_temple_inside',failText:'You rush in anyway — luckily it\'s fine.'}]},
amazon_temple_inside_safe:{chapter:'Chapter 4 · The Temple',title:'CAREFUL APPROACH',emoji:'🔦',text:['You circle the entrance first, looking for signs of recent large animal activity — tracks, droppings, disturbed vegetation. A jaguar will sometimes shelter in ancient ruins.','Nothing. The only occupant is Dr Santos, sitting against a carved wall with a twisted ankle, surrounded by notebooks and very pleased to see another human being.'],scoreChange:20,choices:[{text:'👋 Help Dr Santos',spell:null,successNode:'amazon_found_santos'}]},
amazon_temple_inside:{chapter:'Chapter 4 · The Temple',title:'DR SANTOS!',emoji:'🤗',text:['Dr Santos is sitting against a carved wall with a twisted ankle, six weeks of beard, and the expression of someone who has been slightly worried for quite some time.','"You got my journal!" he says, immediately looking at what you\'re carrying. "Did you find the map? The temple is extraordinary — I\'ve barely scratched the surface."','His ankle is badly sprained. He can walk with support. He could not have got out on his own.'],choices:[{text:'👋 Help him up — let\'s get out of here',spell:null,successNode:'amazon_found_santos'}]},
amazon_found_santos:{chapter:'Chapter 5 · The Journey Out',title:'HEADING HOME',emoji:'🌅',text:['The journey back takes two days. Dr Santos talks the entire time, pointing out plants, naming animals, explaining what the forest is doing and why.','He explains <span class="highlight">PHOTOSYNTHESIS</span> as you walk through a sunbeam splitting through the canopy — "Every single thing that lives in this jungle, from the anaconda to the bacteria in the soil, is powered ultimately by that beam of light hitting a leaf."','When you finally emerge at the riverbank, Valentina\'s face is the most relieved you\'ve ever seen a face.'],vocab:'PHOTOSYNTHESIS',scoreChange:25,choices:[{text:'🛶 Into the boat and home!',spell:null,successNode:'end_amazon_triumph'}]},
end_amazon_triumph:{isEnding:true,type:'good',title:'EXPLORER FOUND!',emoji:'🌿',text:`Dr Santos is flown to the nearest hospital where his ankle is properly treated and he immediately starts writing papers about the temple on the hospital bed.

The Temple of the Green Serpent turns out to be a previously unknown structure — one of the most significant archaeological finds in South America in decades.

Dr Santos insists your name goes on the discovery paper. "I found the temple," he tells journalists. "My rescuers found me. Without them, none of this would exist."

Valentina takes you back to the tributary one last time before you leave. You sit in the canoe in the silence of the early morning — the canopy overhead, the nocturnal creatures going to sleep, the diurnal ones waking up, the incredible biodiversity of the Amazon doing its incomprehensible, photosynthetic, perfectly balanced thing around you.

"Do you understand it?" she asks.

You think about it.

"More than I did," you say. "And enough to want to understand more."

She nods. In the Amazon, that is exactly the right answer.`,scoreBonus:100},
end_amazon_good:{isEnding:true,type:'good',title:'MISSION ACCOMPLISHED!',emoji:'🛶',text:`Dr Santos is safe. The temple is discovered. Valentina navigates you back down the tributary with her usual calm efficiency.

On the river, watching the Amazon slide past on both sides, you read the rest of Dr Santos's journal properly.

He writes about photosynthesis and the canopy and the indigenous communities and the tributaries and everything that makes the Amazon the most biodiverse place on Earth. He writes about how every creature, every plant, every insect plays a role in an ecosystem so complex that scientists have only begun to understand it.

You think about the piranha and the anaconda and the village elder and the temple rising from the trees.

The Amazon is not just a jungle. It's a system. A living, breathing, interdependent system — and you walked through the middle of it.

Pretty good week, all things considered.`,scoreBonus:80},
end_amazon_eaten:{isEnding:true,type:'bad',title:'THE PIRANHAS ARE PLEASED.',emoji:'🐟',text:`In your defence, the river looked very calm.

The piranhas are now very full and looking pleased with themselves, which is the opposite of how you're feeling.

The good news is this is a game. The better news is that you now know exactly what PIRANHA means, what a TRIBUTARY is, and why wading into dark Amazon water is always, always, always a bad idea.

The piranha can spell all those words too. They've had a lot of time to practise.

Press RESTART — and this time, build a bridge.`,scoreBonus:0}}},
asia:{id:'asia',title:'The Jade Dragon',emoji:'🐉',color:'#ef5350',desc:'Journey through Japan, China and Southeast Asia searching for a legendary artefact — and learn to speak like a local.',tag:'Languages · Culture',startNode:'asia_start',
nodes:{
asia_start:{chapter:'Chapter 1 · Tokyo, Japan 🇯🇵',title:'TOKYO, JAPAN',emoji:'🏯',text:['Tokyo hits you like a wall of light, sound and energy. Neon signs in Japanese characters, bullet trains, vending machines on every corner, the smell of ramen from somewhere close by.','You\'re here following a legend: the Jade Dragon — a carved green jade statue hidden by a powerful <span class="highlight">DYNASTY</span> over six hundred years ago to protect a sacred valley. Three countries. One artefact. An extraordinary journey.','A scholar named Professor Yamamoto meets you at the station. "KONNICHIWA!" he says, bowing slightly — that\'s "hello" in Japanese. He teaches you the word on the spot.','"Say it back to me," he says. "It matters here."'],vocab:'KONNICHIWA',choices:[{text:'🙏 Say KONNICHIWA back properly',spell:'KONNICHIWA',spellCtx:'Greet Professor Yamamoto in Japanese — spell KONNICHIWA:',successNode:'asia_scholar_friend',failNode:'asia_scholar_alone',failText:'You mangle it badly. He smiles kindly. "Keep practising," he says.'},{text:'👋 Greet him in English and ask about the dragon',spell:null,successNode:'asia_scholar_alone'}]},
asia_scholar_friend:{chapter:'Chapter 1 · Tokyo, Japan 🇯🇵',title:'KONNICHIWA!',emoji:'😊',text:['Professor Yamamoto beams. "Excellent! Now you\'re ready for Japan."','He shares his research over tea: the Jade Dragon was made for the Emperor of the Ming Dynasty and hidden when the dynasty fell, sometime around the 1640s. The hiding place involves three locations across Asia.','The first clue is at a mountain shrine outside the city. He hands you a folder of documents and a metro card.','As you leave the café, you bow slightly. It feels natural. He bows back.'],scoreChange:25,itemsGain:['Research Documents 📄','Metro Card 🎫'],choices:[{text:'🚄 Take the bullet train to the mountain',spell:null,successNode:'asia_shrine'}]},
asia_scholar_alone:{chapter:'Chapter 1 · Tokyo, Japan 🇯🇵',title:'FINDING YOUR WAY',emoji:'🗺️',text:['Professor Yamamoto gives you his research documents, points you toward the mountain region, and sees you off. He seems slightly disappointed but doesn\'t say so.','The bullet train to the mountain takes forty minutes and moves with remarkable silence. Japan flickers past the window — forests, suburbs, rice fields, distant mountains.'],choices:[{text:'⛰️ Head to the mountain shrine',spell:null,successNode:'asia_shrine'}]},
asia_shrine:{chapter:'Chapter 1 · The Mountain Shrine',title:'THE SHINTO SHRINE',emoji:'⛩️',text:['The shrine sits at the top of one thousand stone steps through a bamboo forest. You arrive breathing hard, to find a place of extraordinary peace.','Red and white buildings. Gravel raked into perfect patterns. The smell of incense.','A monk in grey robes is sweeping the steps. He pauses and looks at you with calm dark eyes. He says something in Japanese that you don\'t fully understand — but you catch a word: tranquil. This is a <span class="highlight">TRANQUIL</span> place.','He offers you tea. You know the right response: ARIGATO — that\'s thank you in Japanese.'],vocab:'TRANQUIL',choices:[{text:'🍵 Accept the tea and say ARIGATO',spell:'ARIGATO',spellCtx:'Say thank you in Japanese — spell ARIGATO:',successNode:'asia_monk_guide',failNode:'asia_monk_polite',failText:'You say something that doesn\'t quite work. He pours the tea anyway.'},{text:'🔍 Ask about the clue first',spell:null,successNode:'asia_monk_polite'}]},
asia_monk_guide:{chapter:'Chapter 1 · The Mountain Shrine',title:'ARIGATO!',emoji:'🍵',text:['The monk\'s face changes entirely — a warm smile. He speaks, and you catch the word "dragon."','Through careful signs and sketches he shows you: there is a carved dragon hidden in the shrine\'s innermost gate. On its base: an inscription pointing to a bamboo valley in China\'s Sichuan province.','You copy the inscription carefully. As you leave, you bow deeply. He bows back, and says one word you look up later in your phrasebook: "Gambatte." It means: do your best.'],scoreChange:30,choices:[{text:'✈️ Fly to China',spell:null,successNode:'asia_china'}]},
asia_monk_polite:{chapter:'Chapter 1 · The Mountain Shrine',title:'AT THE SHRINE',emoji:'⛩️',text:['The monk pours tea quietly. You sit for a moment in the extraordinary silence of the place.','Eventually, through a combination of sign language and the Japanese phrasebook app on your phone, you find what you need: a carved dragon on the innermost gate. The inscription on its base points to Sichuan, China.'],hpChange:-5,choices:[{text:'✈️ Fly to China',spell:null,successNode:'asia_china'}]},
asia_china:{chapter:'Chapter 2 · Sichuan, China 🇨🇳',title:'SICHUAN, CHINA',emoji:'🐼',text:['Sichuan province is a landscape of green mountains and river valleys. Mist hangs in the peaks. Rice terraces step down the hillsides in perfect curves.','A farmer working the field near the road waves as you pass. "NI HAO!" he calls — that\'s hello in Mandarin Chinese.','You\'re looking for a bamboo valley mentioned in the shrine inscription. The farmer clearly knows this area well. But can you greet him properly?'],vocab:'NI HАO',choices:[{text:'👋 Greet him — say NI HAO!',spell:'NIHA0',spellCtx:'Say hello in Chinese — spell NI HAO (no space needed, just: NIHA0 — type NI then HAO):',successNode:'asia_china_local',failNode:'asia_china_alone',failText:'You wave instead. He waves back cheerfully enough.'},{text:'🗺️ Check your map for the bamboo valley',spell:null,successNode:'asia_china_alone'}]},
asia_china_local:{chapter:'Chapter 2 · Sichuan, China 🇨🇳',title:'NI HAO!',emoji:'😄',text:['The farmer\'s face breaks into a huge smile. He gestures for you to wait and calls to someone in his house.','His daughter comes out — she speaks English and acts as translator. The farmer knows the bamboo valley well; there\'s a giant panda reserve there. He also knows of the legend of the Jade Dragon — his grandmother told him stories about it as a child.','He draws a map to the reserve on the back of a seed packet. His daughter says: "Dad says to follow the pandas. They always find the right paths."'],scoreChange:30,choices:[{text:'🐼 Head to the panda reserve',spell:null,successNode:'asia_panda'}]},
asia_china_alone:{chapter:'Chapter 2 · Sichuan, China 🇨🇳',title:'FINDING THE VALLEY',emoji:'🗺️',text:['Your map leads you up a winding road into the hills. After two hours you find the sign: Giant Panda Reserve. The bamboo valley — dense, green, impossibly tall stems — stretches ahead.'],choices:[{text:'🐼 Enter the bamboo valley',spell:null,successNode:'asia_panda'}]},
asia_panda:{chapter:'Chapter 2 · The Bamboo Valley',title:'THE PANDA RESERVE',emoji:'🐼',text:['The bamboo valley is extraordinary. Stems of <span class="highlight">BAMBOO</span> rise fifteen metres overhead, swaying gently, filtering the light into pale green columns.','And sitting directly in the middle of the path, completely blocking it, is a giant panda. It is eating bamboo with single-minded dedication and does not appear to notice you at all.','Behind it, through the bamboo stems, you can just make out a carved stone marker — the next clue in the Jade Dragon trail.','The panda is enormous, surprisingly fast when it wants to be, and entirely unbothered by your existence.'],vocab:'BAMBOO',choices:[{text:'⏳ Wait patiently for the panda to finish eating',spell:'BAMBOO',spellCtx:'The panda is eating BAMBOO — name its favourite food. Spell it:',successNode:'asia_panda_patience',failNode:'asia_panda_rush',failText:'You try to squeeze past and the panda looks up, mildly annoyed.'},{text:'🔄 Try to find a way around through the bamboo',spell:null,dice:true,diceGoodNode:'asia_panda_patience',diceBadNode:'asia_panda_rush',diceGoodText:'You find a narrow gap and squeeze through without disturbing it.',diceBadText:'You step on a bamboo shoot. The panda looks up. It is mildly annoyed.',diceBadHp:-5,successNode:'asia_panda_patience'}]},
asia_panda_patience:{chapter:'Chapter 2 · The Bamboo Valley',title:'THE PANDA MOVES',emoji:'🐼',text:['Twenty-three minutes later, the panda finishes its bamboo, stretches with great dignity, and ambles off the path.','You wait another two minutes just to be certain.','The stone marker, when you reach it, has a carving of a dragon and text in classical Chinese characters. Professor Yamamoto (you message him photos) translates within the hour: "The dragon rests in the valley of the <span class="highlight">MONSOON</span> rains, beneath the golden pagoda, in the land of a thousand islands."','Southeast Asia. You\'re going to Southeast Asia.'],vocab:'MONSOON',scoreChange:20,choices:[{text:'✈️ Head to Southeast Asia',spell:null,successNode:'asia_temple'}]},
asia_panda_rush:{chapter:'Chapter 2 · The Bamboo Valley',title:'PANDA OBJECTION',emoji:'🐼',text:['The panda stands up. It is larger than you thought. It makes a sound. It is not a friendly sound.','You back away respectfully. The panda sits back down and resumes eating. You wait. Eventually it moves on.','The stone marker gives you the next clue: Southeast Asia, beneath a golden pagoda.'],hpChange:-5,choices:[{text:'✈️ Head to Southeast Asia',spell:null,successNode:'asia_temple'}]},
asia_temple:{chapter:'Chapter 3 · Southeast Asia',title:'THE GOLDEN PAGODA',emoji:'🏯',text:['The golden <span class="highlight">PAGODA</span> rises from the jungle mist like something from a dream — seven tiers of gilded roofs curving upward, surrounded by ancient trees and the sound of bells.','The <span class="highlight">MONSOON</span> season has begun. Rain falls in warm, heavy curtains. The jungle steams.','At the base of the pagoda, carved in three languages, is the final inscription. Professor Yamamoto translates the final line: "The dragon belongs to its valley. The seeker who understands this shall find peace. The seeker who does not shall find nothing."','As you\'re reading, something moves at the edge of the treeline. A tiger. Watching.'],vocab:'PAGODA',choices:[{text:'🐯 Acknowledge the tiger — move slowly and respectfully',spell:'DYNASTY',spellCtx:'The dragon was hidden by an ancient DYNASTY — a ruling family across generations. Spell it:',successNode:'asia_tiger_respect',failNode:'asia_tiger_startled',failText:'You startle at the tiger and it melts back into the jungle — gone.'},{text:'🏛️ Go straight to the temple — ignore the tiger',spell:null,dice:true,diceGoodNode:'asia_tiger_respect',diceBadNode:'asia_tiger_startled',diceGoodText:'The tiger watches you pass but doesn\'t follow.',diceBadText:'You move too fast — the tiger ROARS and you scramble inside!',diceBadHp:-15,successNode:'asia_tiger_startled'}]},
asia_tiger_respect:{chapter:'Chapter 3 · The Temple',title:'THE TIGER WATCHES',emoji:'🐯',text:['You stop moving. You lower your eyes slightly — not fully, just enough to show you\'re not a threat. You breathe slowly.','The tiger blinks. It holds your gaze for a long moment. Then it turns and slips silently back into the jungle.','Professor Yamamoto told you about this. Tigers in this region have a relationship with the temples. They\'ve lived alongside these sacred places for centuries. They\'re not aggressive unless they feel threatened.','The inscription makes more sense now. The dragon belongs to its valley.'],scoreChange:25,choices:[{text:'🏛️ Enter the temple with understanding',spell:null,successNode:'asia_inner_temple'}]},
asia_tiger_startled:{chapter:'Chapter 3 · The Temple',title:'INTO THE TEMPLE',emoji:'🏯',text:['Inside the temple, sheltering from the rain and catching your breath, you find the inner shrine.','The inscription continues here. You photograph everything for Professor Yamamoto.'],hpChange:-5,choices:[{text:'📜 Study the inner shrine',spell:null,successNode:'asia_inner_temple'}]},
asia_inner_temple:{chapter:'Chapter 4 · The Inner Shrine',title:'THE INNER SHRINE',emoji:'✨',text:['The inner shrine is small and perfectly still. On a stone pedestal in the centre: the Jade Dragon. Exactly as described in the legend — carved green jade, a metre long, coiled around a sphere. Extraordinary.','On the wall beside it, carved in many languages, the same message: "This was placed here by our <span class="highlight">ANCESTORS</span> to protect the valley. It will protect the valley only so long as it remains here."','You take out your camera. You take photographs. You sketch it in your notebook.','The right thing to do is leave it here. You know that. This belongs to the valley and to the people of this place.','But you want to say thank you — in Chinese. XIÈXIÈ.'],vocab:'ANCESTOR',choices:[{text:'🙏 Say XIÈXIÈ and leave the dragon in peace',spell:'XIEXIE',spellCtx:'Say thank you in Chinese — spell XIÈXIÈ (type: XIEXIE):',successNode:'asia_respectful_departure',failNode:'asia_took_nothing',failText:'You try and almost get it. You bow instead. It feels right.'},{text:'📷 Take one last photo and go',spell:null,successNode:'asia_took_nothing'}]},
asia_respectful_departure:{chapter:'Chapter 5 · The Journey Home',title:'THE RIGHT CHOICE',emoji:'🙏',text:['You leave the Jade Dragon exactly where it is. You have photographs, sketches, measurements, translation notes, and the most extraordinary story you\'ve ever had to tell.','As you walk out, the rain has stopped. Mist drifts through the pagoda tiers. A monk you hadn\'t seen appears from somewhere and bows to you.','He says one word that you now understand: ARIGATO. The languages blur together out here. Thank you. In any language. The meaning is the same.','The tiger is sitting in the clearing. It watches you leave.'],scoreChange:50,choices:[{text:'🏠 Head home',spell:null,successNode:'end_asia_wisdom'}]},
asia_took_nothing:{chapter:'Chapter 5 · The Journey Home',title:'LEAVING EMPTY-HANDED',emoji:'🐉',text:['You leave the Jade Dragon where it belongs. You have everything you came for — the story, the photographs, the understanding.','The rain stops as you emerge from the temple. The valley glitters.'],scoreChange:25,choices:[{text:'🏠 Head home',spell:null,successNode:'end_asia_good'}]},
end_asia_wisdom:{isEnding:true,type:'good',title:'THE JADE DRAGON REMAINS!',emoji:'🐉',text:`Your report causes a sensation. Not because you found the Jade Dragon — but because you chose to leave it.

Academic papers are written about the decision. Professor Yamamoto calls it "the most mature act of cultural respect in modern archaeological exploration."

The valley, now named in the papers, becomes a protected site. The local communities who have lived there for centuries finally have formal recognition of their heritage.

You speak at a conference. Four languages. KONNICHIWA to the Japanese delegation. NI HAO to the Chinese contingent. ARIGATO to the scholars who helped you. A phrase in the valley's own language, taught to you by the monk.

"The Jade Dragon belongs to its valley," you say. "And the valley belongs to its people. I just helped the world know it was there."

In the valley, the tiger still patrols the pagoda.

The ancestors who hid the dragon six hundred years ago chose the right guardian.`,scoreBonus:150},
end_asia_good:{isEnding:true,type:'good',title:'JOURNEY COMPLETE!',emoji:'🌏',text:`Japan, China, Southeast Asia. A bullet train, two flights, one very patient panda, and a tiger encounter you'll describe at dinner parties for the rest of your life.

The Jade Dragon stays where it belongs. Your photographs and research notes are published and help protect the valley as a heritage site.

Professor Yamamoto sends you a message when the paper comes out:

"KONNICHIWA. ARIGATO. NI HAO. XIEXIE. You learned to say hello and thank you in four languages on this journey. Do you know what that means?"

You write back: "That wherever I go, I can make a friend?"

He writes back: "Exactly. And with a friend, there is no place you cannot reach."

You think about this for a long time.

He's right.`,scoreBonus:80},
end_asia_dragon:{isEnding:true,type:'bad',title:'THE DRAGON WOKE UP.',emoji:'🐉',text:`Look. The inscription said "belongs to its valley." It said "protect." It said things would go wrong for people who didn't understand this.

You perhaps should have read the inscription more carefully.

The Jade Dragon is now awake, approximately eight feet tall in its fully animated form, and is looking at you with an expression that suggests it has opinions about being removed from its pedestal.

On the positive side: this is extremely cool and you are going to have an excellent story.

On the negative side: it is blocking the door.

The tiger outside is also watching through the window. It looks smug.

Press RESTART — and this time, leave the dragon where it belongs.`,scoreBonus:0}}},
africa:{id:'africa',title:'The Great Migration',emoji:'🦁',color:'#ff9800',desc:'Follow the Great Migration across the African savanna — lions, elephants, gorillas and real Swahili words.',tag:'Wildlife · Swahili',startNode:'africa_start',
nodes:{
africa_start:{chapter:'Chapter 1 · The Serengeti',title:'DAWN ON THE SERENGETI',emoji:'🌅',text:['The sun rises over the <span class="highlight">SAVANNA</span> like a slow explosion of gold and orange. The sky turns pink and purple at the edges. It is, without question, the most beautiful sunrise you have ever seen.','Your jeep has broken down. Of course it has. This is exactly the kind of thing that happens on the first morning of a safari.','Your guide, Joseph, is completely calm. He radios for a mechanic (estimated arrival: four hours) and turns to you with a grin: "JAMBO!" he says. That\'s Swahili — the language spoken across East Africa. It means hello.','You have four hours on foot in the Serengeti. Joseph is an expert. You are going to see extraordinary things.'],vocab:'JAMBO',choices:[{text:'🤝 Say JAMBO back to Joseph!',spell:'JAMBO',spellCtx:'Greet Joseph in Swahili — spell JAMBO:',successNode:'africa_guide_friend',failNode:'africa_guide_polite',failText:'You wave instead. Joseph nods and starts walking — you follow.'},{text:'🚶 Ask about the plan and start walking',spell:null,successNode:'africa_guide_polite'}]},
africa_guide_friend:{chapter:'Chapter 1 · The Serengeti',title:'JAMBO!',emoji:'😄',text:['"JAMBO!" Joseph laughs. "You know Swahili! Excellent." He hands you binoculars and starts naming everything around you as you walk.','Within ten minutes you\'ve spotted: zebra, wildebeest, a secretary bird, three different kinds of gazelle, something Joseph identifies as a dik-dik (a very small antelope with an excellent name), and — in the far distance — the wide grey shapes of a herd of elephants.','Joseph seems genuinely pleased to have an interested companion. He teaches you words as you walk.'],scoreChange:20,choices:[{text:'🌿 Walk the savanna with Joseph',spell:null,successNode:'africa_savanna'}]},
africa_guide_polite:{chapter:'Chapter 1 · The Serengeti',title:'WALKING THE SAVANNA',emoji:'🌿',text:['Joseph leads you across the savanna at an easy pace, pointing out animals without breaking stride. He\'s been a guide for twenty years and knows every square kilometre of this landscape.','Already you\'ve seen zebra, wildebeest and gazelle in every direction.'],choices:[{text:'🌿 Continue with Joseph',spell:null,successNode:'africa_savanna'}]},
africa_savanna:{chapter:'Chapter 1 · The Serengeti',title:'THE GREAT MIGRATION',emoji:'🦓',text:['You\'re here at the perfect time. The Great <span class="highlight">MIGRATION</span> — the largest movement of animals on Earth — is happening around you right now.','Over a million wildebeest, half a million zebra, and hundreds of thousands of gazelle moving in a great circle across the Serengeti and the Masai Mara, following the rains and the fresh grass.','Joseph stops walking. "Look," he says quietly.','The horizon is moving. The entire horizon, as far as you can see, is a solid mass of animals coming toward you. The ground vibrates faintly with the weight of it. The sound is a low rumble like distant thunder.','Nothing could have prepared you for this.'],vocab:'MIGRATION',choices:[{text:'📍 Stand your ground and watch',spell:'MIGRATION',spellCtx:'This MIGRATION is one of Earth\'s greatest events — spell the word:',successNode:'africa_migration_understand',failNode:'africa_migration_confused',failText:'You move at the wrong moment and the herd splits around you chaotically.'},{text:'📸 Move for a better view',spell:null,dice:true,diceGoodNode:'africa_migration_understand',diceBadNode:'africa_migration_confused',diceGoodText:'You find a termite mound that gives you a perfect elevated view!',diceBadText:'You move into the path of the herd and have to scramble out of the way.',diceBadHp:-5,successNode:'africa_migration_understand'}]},
africa_migration_understand:{chapter:'Chapter 1 · The Serengeti',title:'THE RIVER OF LIFE',emoji:'🦓',text:['Joseph explains as you watch: "The wildebeest follow the grass. The grass follows the rain. The rain follows the season. Everything is connected."','He points to a group of lions watching from a kopje — a rocky outcrop. "The predators follow the migration too. Where the herbivores go, the carnivores follow."','You stand and watch for an hour. The herd flows around you like a river around a stone. Individual animals look up at you with large brown eyes, utterly unafraid.'],scoreChange:25,choices:[{text:'💧 Head to the watering hole',spell:null,successNode:'africa_watering_hole'}]},
africa_migration_confused:{chapter:'Chapter 1 · The Serengeti',title:'SWEPT ALONG',emoji:'😅',text:['The herd splits around you and you spin in every direction, suddenly surrounded by wildebeest. Joseph grabs your arm.','Eventually the herd passes. You\'re slightly dishevelled but unharmed. Joseph is trying not to laugh.','"Move WITH the animals," he says. "Never against them."'],hpChange:-5,choices:[{text:'💧 Head to the watering hole',spell:null,successNode:'africa_watering_hole'}]},
africa_watering_hole:{chapter:'Chapter 2 · The Watering Hole',title:'THE WATERING HOLE',emoji:'💧',text:['The watering hole is the most dramatic place on the savanna. Every animal that needs water must come here — <span class="highlight">HERBIVORE</span> and carnivore alike — which makes it both essential and extremely tense.','Zebra drink nervously, ears rotating like radar dishes. Giraffes splay their impossible legs to reach the water. A family of warthogs barrels through everyone.','And stretched across a flat rock beside the water, watching everything with sleepy eyes: a lion. A SIMBA. A real one. Right there.','Joseph says very quietly: "We wait here. We do not approach.','The lion is enormous. Tawny and golden and absolutely in charge of this entire situation.'],vocab:'SIMBA',choices:[{text:'📸 Stay still and observe — let it come to us if it wants',spell:'SIMBA',spellCtx:'That\'s a SIMBA — spell the Swahili word for lion:',successNode:'africa_lion_knowledge',failNode:'africa_lion_danger',failText:'You shift your weight and the lion opens one eye and stares at you.'},{text:'🔍 Move closer for a better look',spell:null,dice:true,diceGoodNode:'africa_lion_knowledge',diceBadNode:'africa_lion_danger',diceGoodText:'You find a perfect spot behind a bush — the lion doesn\'t notice you.',diceBadText:'The lion stands up. It is very large standing up. Joseph steps in front of you.',diceBadHp:-15,successNode:'africa_lion_knowledge'}]},
africa_lion_knowledge:{chapter:'Chapter 2 · The Watering Hole',title:'LEARNING FROM THE SIMBA',emoji:'🦁',text:['You watch the lion for forty minutes without moving. It drinks. It grooms. A cub appears from behind the rocks — then another. A family.','Joseph whispers: "Lions sleep up to twenty hours a day. The females do most of the hunting. A pride\'s territory can be three hundred square kilometres."','As the sun climbs, the lion family moves away from the water into the shade of acacia trees. The watering hole relaxes.','Movement at the far side: a TEMBO — an elephant — family is arriving.'],scoreChange:20,choices:[{text:'🐘 Watch the elephants arrive',spell:null,successNode:'africa_elephant'}]},
africa_lion_danger:{chapter:'Chapter 2 · The Watering Hole',title:'THE LION STANDS UP',emoji:'🦁',text:['The lion rises to its full height. It is — Joseph notes later — approximately one hundred and eighty kilograms of predator expressing mild displeasure.','Joseph steps in front of you, raises his arms, and makes himself look very large. The lion holds its ground for ten very long seconds. Then it turns and walks — unhurriedly, because lions are never hurried — back to its rock.','Joseph turns to you. He does not say anything. But the look says quite a lot.'],hpChange:-15,choices:[{text:'🐘 Watch the elephants arrive',spell:null,successNode:'africa_elephant'}]},
africa_elephant:{chapter:'Chapter 2 · The Watering Hole',title:'THE ELEPHANTS',emoji:'🐘',text:['The TEMBO family arrives at the water and the whole dynamic of the watering hole changes. Every other animal gives them space — respectfully, without fuss. Elephants take precedence here.','The <span class="highlight">MAJESTIC</span> matriarch — the oldest female who leads the family — wades in up to her knees and begins spraying water over herself with her trunk. A tiny calf tries to do the same and mostly sprays itself in the face.','Joseph is smiling. "Elephants grieve their dead. They remember faces for decades. They look after each other across a lifetime. Some scientists think they\'re more socially complex than us."','The calf tries the water-spraying again. It goes slightly better.'],vocab:'TEMBO',choices:[{text:'⏳ Wait for the elephants to pass — let them take their time',spell:'TEMBO',spellCtx:'These are TEMBO — spell the Swahili word for elephant:',successNode:'africa_elephant_patience',failNode:'africa_elephant_rush',failText:'You try to move past too soon — the mother spreads her ears at you!'},{text:'🌿 Skirt around them and head to the forest',spell:null,dice:true,diceGoodNode:'africa_elephant_patience',diceBadNode:'africa_elephant_rush',diceGoodText:'You find a wide path around and the elephants don\'t react.',diceBadText:'The calf notices you and runs behind its mother, who turns to investigate.',diceBadHp:-10,successNode:'africa_elephant_patience'}]},
africa_elephant_patience:{chapter:'Chapter 2 · The Watering Hole',title:'THE MATRIARCH NODS',emoji:'🐘',text:['You wait. You are still. The elephant family takes their full time at the water — twenty minutes, unhurried, complete.','As the matriarch turns to leave, she swings her head in your direction and looks at you with one small, intelligent eye for three full seconds.','"She\'s accepted you," Joseph says quietly. "She knows you\'re not a threat."','You don\'t know if that\'s exactly true. But the look in her eye is something you\'ll remember for the rest of your life.'],scoreChange:30,hpChange:5,choices:[{text:'🌿 Head into the forest region',spell:null,successNode:'africa_forest'}]},
africa_elephant_rush:{chapter:'Chapter 2 · The Watering Hole',title:'MOCK CHARGE!',emoji:'😱',text:['The mother elephant\'s ears spread wide. She takes three steps toward you — enormous, decisive steps.','Joseph pulls you sideways. "Mock charge," he breathes. "Don\'t run. Stand your ground."','You stand your ground. Every instinct screams. The elephant stops, watches, and then turns back to her calf.','"That was a warning," Joseph says. "She\'s given us one. Let\'s use it wisely and give her family some space."'],hpChange:-10,choices:[{text:'🌿 Head to the forest',spell:null,successNode:'africa_forest'}]},
africa_forest:{chapter:'Chapter 3 · The Mountain Forest',title:'THE GORILLA FOREST',emoji:'🌿',text:['The landscape changes as you climb into the forested mountain zone. The savanna gives way to dense rainforest — cool, green, smelling of moss and soil.','This is a different <span class="highlight">ECOSYSTEM</span> entirely. Everything here is connected differently: different trees, different insects, different birds. And — Joseph stops and points through the trees — different apes.','A silverback mountain gorilla is sitting ten metres away, methodically eating leaves from a branch. Behind him, just visible: three females and two small juveniles.','You remember what you know about gorilla behaviour. Do not make eye contact. Do not stand tall. Do not smile (showing teeth looks aggressive). Lower yourself. Be small. Be calm.'],vocab:'ECOSYSTEM',choices:[{text:'🦍 Sit low and avoid eye contact — be small',spell:'ECOSYSTEM',spellCtx:'The ECOSYSTEM here works differently from the savanna. Spell the word:',successNode:'africa_gorilla_respect',failNode:'africa_gorilla_uncertain',failText:'You try but look the silverback in the eye briefly — he sees you immediately.'},{text:'📸 Stay very still and take a photo',spell:null,dice:true,diceGoodNode:'africa_gorilla_respect',diceBadNode:'africa_gorilla_uncertain',diceGoodText:'You stay completely still and the gorilla family carries on as if you\'re not there.',diceBadText:'Your camera clicks. The silverback looks up directly at you.',diceBadHp:-5,successNode:'africa_gorilla_uncertain'}]},
africa_gorilla_respect:{chapter:'Chapter 3 · The Mountain Forest',title:'ACCEPTED BY THE SILVERBACK',emoji:'🦍',text:['You sit on the ground, knees up, eyes down, making yourself as small and unthreatening as possible.','For five minutes nothing happens. Then the silverback stands, walks within three metres of you, sniffs the air, looks at Joseph (who he clearly knows), and sits back down.','A juvenile gorilla sidles over and touches your shoe with one long finger. You do not move. It sidles back. The females ignore you completely.','This, Joseph says later, is the greatest privilege the forest can offer.'],scoreChange:40,hpChange:5,choices:[{text:'🏠 Head to the ranger station',spell:null,successNode:'africa_ranger'}]},
africa_gorilla_uncertain:{chapter:'Chapter 3 · The Mountain Forest',title:'THE SILVERBACK HUFFS',emoji:'🦍',text:['The silverback huffs and beats his chest once — a sound like a bass drum that shakes the leaves. The family moves away into the forest.','You and Joseph freeze for two minutes. Then the forest settles again.','Joseph is careful not to comment. But he does explain, walking on, exactly what you could have done differently.','You take notes.'],hpChange:-5,choices:[{text:'🏠 Head to the ranger station',spell:null,successNode:'africa_ranger'}]},
africa_ranger:{chapter:'Chapter 4 · The Ranger Station',title:'THE RANGER STATION',emoji:'🏕️',text:['The ranger station is a collection of wooden buildings in a clearing. Rangers in green uniforms are checking equipment, updating maps, reviewing data from camera traps.','These people work in <span class="highlight">CONSERVATION</span> — protecting the wildlife and the ecosystem against poaching, habitat loss and climate change. The work is constant and not always easy.','Ranger Captain Amara shakes your hand. Joseph has radioed ahead — she knows you\'ve had quite a morning.','She hands you sweet tea. You know exactly what to say: "ASANTE." Thank you, in Swahili.'],vocab:'CONSERVATION',choices:[{text:'🙏 Say ASANTE properly',spell:'ASANTE',spellCtx:'Say thank you in Swahili — spell ASANTE:',successNode:'africa_ranger_gratitude',failNode:'africa_ranger_thanks',failText:'You try and get close. Amara accepts it warmly anyway.'},{text:'🌿 Ask about the conservation work',spell:null,successNode:'africa_ranger_thanks'}]},
africa_ranger_gratitude:{chapter:'Chapter 4 · The Night Drive',title:'ASANTE!',emoji:'😊',text:['Amara\'s face lights up. "You know Swahili! Joseph has been teaching you?"','"JAMBO. SIMBA. TEMBO. ASANTE," you list.','She laughs. "That\'s four words. You\'re practically fluent."','She decides, then and there, that you\'ve earned a night drive. As the sun sets and the <span class="highlight">NOCTURNAL</span> animals begin their shift, a jeep (now fixed) takes you back out into the dark.'],vocab:'NOCTURNAL',scoreChange:25,choices:[{text:'🌙 Go on the night drive',spell:null,successNode:'africa_night_drive'}]},
africa_ranger_thanks:{chapter:'Chapter 4 · The Ranger Station',title:'CONSERVATION WORK',emoji:'🌿',text:['Amara shows you the camera trap data: lions, leopards, cheetahs, hyenas — all tracked and monitored. The data helps them understand territory and threats.','She explains the <span class="highlight">VULNERABLE</span> species they\'re working to protect: black rhinos (fewer than 6,000 left on Earth), mountain gorillas, wild dogs, cheetahs.','Every animal you\'ve seen today exists partly because of people like her.'],vocab:'VULNERABLE',scoreChange:15,choices:[{text:'🌙 Watch the sunset over the savanna',spell:null,successNode:'end_africa_good'}]},
africa_night_drive:{chapter:'Chapter 4 · The Night',title:'THE NIGHT DRIVE',emoji:'🌙',text:['The savanna at night is a completely different world.','In the beam of the spotlight: a leopard moving through the grass with absolute fluid silence. A pair of bat-eared foxes trotting on invisible paths. A porcupine, hugely spiky, unconcerned by your presence.','And then — in a patch of open ground — a family of aardvarks. Long snouts to the ground, digging for termites, completely nocturnal, almost never seen by day.','You watch them for twenty minutes without speaking.'],scoreChange:30,choices:[{text:'🌅 Head back to camp as dawn approaches',spell:null,successNode:'end_africa_triumph'}]},
end_africa_triumph:{isEnding:true,type:'good',title:'AN UNFORGETTABLE DAY!',emoji:'🦁',text:`Dawn finds you back at camp, wrapped in a blanket, watching the sun return to the savanna.

You've seen: the Great Migration (over a million animals), a family of lions at the waterhole (SIMBA), elephants (TEMBO) up close — one of them looked you in the eye, a silverback mountain gorilla who touched your shoe, a leopard, aardvarks, foxes, and more birds than you can count.

You've learned: JAMBO (hello), SIMBA (lion), TEMBO (elephant), ASANTE (thank you), and SAFARI — a Swahili word that means "journey." That's where the English word comes from. Every safari you've ever heard of started as a Swahili word meaning simply: journey.

Joseph sits beside you with his own tea.

"What was the best part?" he asks.

You think about the matriarch elephant's eye. The gorilla touching your shoe. The aardvarks in the spotlight. The migration rolling across the golden plain.

"All of it," you say. "Every single word of it."

He nods. "That," he says, "is the right answer."`,scoreBonus:100},
end_africa_good:{isEnding:true,type:'good',title:'THE SERENGETI SUNSET!',emoji:'🌅',text:`The sun sets over the savanna in shades of amber, gold and deep red — the same colours as the lions, the same colours as the dust, the same colours as Africa has worn since long before there were words for any of them.

Joseph drives you back to camp in the repaired jeep. You don't talk much. The landscape says everything.

You've seen the migration. You've watched lions at the waterhole. Elephants. Gorillas. You've spoken Swahili to a guide who shared his world with you.

JAMBO. SIMBA. TEMBO. ASANTE. SAFARI.

Five words. Five keys to a door. And behind the door: one of the most astonishing days of your life.

Every journey starts with a word. Usually: hello.`,scoreBonus:80},
end_africa_lost:{isEnding:true,type:'bad',title:'STILL ON THE SAVANNA...',emoji:'🌾',text:`You are still on the savanna. 

In your defence, the savanna is very large and the jeep is still broken and the mechanic appears to have taken a very scenic route.

A meerkat has appeared and is standing on its back legs watching you from a nearby termite mound. It seems to be judging the situation.

Two more meerkats appear. They also judge.

The good news: you have now had a very long time to study the ecosystem around you. You know that the savanna has at least forty-seven different species visible from where you're standing. You know that the migration passes this exact spot twice a year. You know that meerkats live in cooperative groups where members take turns standing guard — a role called a "sentinel."

The meerkats, apparently satisfied that you are not a predator but merely confused, go back to foraging.

JAMBO, you tell them. They don't respond. But one of them does look back.

Press RESTART — and this time, follow Joseph.`,scoreBonus:0}}}};


// ═══════════════════════════════════════════════════════════════
//  GAME ENGINE
// ═══════════════════════════════════════════════════════════════

let ACTIVE = null;
let PS     = {};
let spellAttempts = 0;
const G = { hp:100, score:0, items:[], node:'', wordsLearned:[], wordsSpelled:[] };

const $ = id => document.getElementById(id);

function show(el) { el.classList.add('active');    el.style.display=''; }
function hide(el) { el.classList.remove('active'); el.style.display='none'; }

// ── Story picker ───────────────────────────────────────────────
function showPicker() {
  ACTIVE = null;
  const picker = $('picker');
  picker.style.display = '';
  $('main').style.display   = 'none';
  hide($('spell-overlay'));
  hide($('dice-overlay'));
  hide($('flash'));
  $('back-btn').style.display  = 'none';
  $('score-val').style.display = 'none';

  picker.innerHTML = `<p class="picker-title">⚡ CHOOSE YOUR ADVENTURE</p>
    <p class="picker-sub">Seven worlds to explore. Each one has spelling challenges, dice rolls, vocabulary words and multiple endings.</p>
    <div class="story-grid" id="story-grid"></div>`;

  const grid = $('story-grid');
  Object.values(STORIES).forEach(s => {
    const card = document.createElement('div');
    card.className = 'story-card';
    card.style.borderColor = s.color;
    card.innerHTML = `<div class="sc-emoji">${s.emoji}</div>
      <div class="sc-title" style="color:${s.color}">${s.title}</div>
      <div class="sc-tag">${s.tag}</div>
      <div class="sc-desc">${s.desc}</div>`;
    card.onclick = () => startStory(s.id);
    grid.appendChild(card);
  });
}

function startStory(id) {
  ACTIVE = STORIES[id];
  G.hp=100; G.score=0; G.items=[]; G.wordsLearned=[]; G.wordsSpelled=[];
  $('picker').style.display = 'none';
  $('main').style.display   = '';
  $('back-btn').style.display  = '';
  $('score-val').style.display = '';
  updateHUD();
  go(ACTIVE.startNode);
}

// ── Navigation ─────────────────────────────────────────────────
function go(nodeId) {
  G.node = nodeId;
  const node = ACTIVE.nodes[nodeId];
  if (!node) { flash('Unknown scene: ' + nodeId, 'bad'); return; }
  if (node.hpChange)    G.hp = Math.max(0, Math.min(100, G.hp + node.hpChange));
  if (node.scoreChange) G.score += node.scoreChange;
  if (node.itemsGain)   node.itemsGain.forEach(it => { if (!G.items.includes(it)) G.items.push(it); });
  if (node.vocab && !G.wordsLearned.includes(node.vocab)) G.wordsLearned.push(node.vocab);
  updateHUD();
  if (node.isEnding) renderEnding(node); else renderNode(node);
}

// ── Render scene ───────────────────────────────────────────────
function renderNode(node) {
  const area  = $('game-area');
  const paras = Array.isArray(node.text) ? node.text : [node.text];

  let vocabHTML = '';
  if (node.vocab && VOCAB[node.vocab]) {
    const v = VOCAB[node.vocab];
    vocabHTML = `<div class="vocab-box">
      <div class="vocab-word">${node.vocab}</div>
      <div class="vocab-def">${v.def}</div>
      <div class="vocab-ex">"${v.ex}"</div>
    </div>`;
  }

  const choicesHTML = (node.choices || []).map((c, i) => {
    const badge = c.spell ? '<span class="badge">SPELL IT</span>'
                : c.dice  ? '<span class="badge">🎲 ROLL</span>' : '';
    const cls   = 'choice-btn ' + (c.spell ? 'choice-spell' : 'choice-free');
    return `<button class="${cls}" onclick="handleChoice(${i})">${c.text} ${badge}</button>`;
  }).join('');

  area.innerHTML = `<div class="scene-card">
    <div class="scene-header">
      <div class="scene-emoji">${node.emoji || '🌿'}</div>
      <div class="scene-title-wrap">
        <div class="scene-title">${node.title || ''}</div>
        <div class="scene-chapter">${node.chapter || ''}</div>
      </div>
    </div>
    <div class="scene-body">${paras.map(p => `<p>${p}</p>`).join('')}${vocabHTML}</div>
    <div class="choices-wrap">
      <div class="choices-label">What do you do?</div>
      ${choicesHTML}
    </div>
  </div>`;
  area.scrollTop = 0;
}

// ── Render ending ──────────────────────────────────────────────
function renderEnding(node) {
  if (node.scoreBonus) { G.score += node.scoreBonus; updateHUD(); }
  const area = $('game-area');
  const typeClass = node.type === 'bad' ? 'bad' : node.type === 'secret' ? 'secret' : 'good';
  const typeLabel = node.type === 'good' ? 'ADVENTURE COMPLETE!'
                  : node.type === 'secret' ? '★ SECRET ENDING ★' : 'GAME OVER';
  const paras = Array.isArray(node.text) ? node.text : (node.text || '').split('\n\n');

  const learnedRows = G.wordsLearned.map(w => {
    const v = VOCAB[w]; if (!v) return '';
    return `<div class="word-row"><span class="wr-word">${w}</span><span class="wr-def">${v.def}</span></div>`;
  }).join('');

  const spelledLine = G.wordsSpelled.length
    ? `<p class="spelled-line">Words you spelled correctly: <strong>${G.wordsSpelled.join(', ')}</strong></p>` : '';

  area.innerHTML = `<div class="ending-wrap">
    <div class="ending-big-emoji">${node.emoji || '🏆'}</div>
    <div class="ending-title ${typeClass}">${typeLabel}</div>
    <div class="ending-title" style="font-size:1.5rem;margin-bottom:14px">${node.title || ''}</div>
    <div class="final-score">Score: ${G.score}</div>
    <div class="ending-body">${paras.filter(p=>p.trim()).map(p=>`<p>${p}</p>`).join('')}</div>
    ${learnedRows ? `<div class="words-panel"><h3>📚 WORDS YOU LEARNED</h3>${learnedRows}</div>` : ''}
    ${spelledLine}
    <div style="margin-top:20px">
      <button class="restart-btn" onclick="startStory(ACTIVE.id)">🔄 PLAY AGAIN</button>
      <button class="back-picker-btn" onclick="showPicker()">◀ ALL ADVENTURES</button>
    </div>
  </div>`;
  area.scrollTop = 0;
}

// ── Choice handler ─────────────────────────────────────────────
function handleChoice(i) {
